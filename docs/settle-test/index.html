<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>[테스트] 정산 관리</title></head>
<body><div id="tl" style="font:14px sans-serif;padding:40px;text-align:center;color:#555">테스트 웹 불러오는 중…</div>
<script>
/* 테스트 웹 로더: 실제 정산관리(../settle/index.html)를 불러와 테스트용으로 몇 군데만 바꿔서 띄움.
   - 서버 함수: settle-api-test (settle_test_* 테이블만 사용, config.js 의 fn)
   - 환수발생: 워크라인에서 바로 가져오기 버튼 */
const PATCH = [["<title>정산 관리<\/title>\n", "<title>[테스트] 정산 관리<\/title>\n"], ["<body>\n", "<body>\n<div id=\"testRibbon\" style=\"position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#e8590c;color:#fff;font-size:12px;font-weight:700;text-align:center;padding:3px 0;pointer-events:none\">테스트 웹 — 여기서 바꾼 내용은 실제 정산관리에 반영되지 않습니다<\/div>\n"], ["const BUILD='s1021-80';   // 배포 확인용 빌드 표시 (s = Supabase 버전)\n", "const BUILD='TEST-t1106-1';   // 배포 확인용 빌드 표시 (s = Supabase 버전)\n"], ["    const res = await fetch(`${CFG.url}/functions/v1/settle-api`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': CFG.anonKey, 'Authorization': 'Bearer ' + session.access_token }, body: JSON.stringify({ fn, args }) });\n", "    const res = await fetch(`${CFG.url}/functions/v1/${CFG.fn||'settle-api'}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': CFG.anonKey, 'Authorization': 'Bearer ' + session.access_token }, body: JSON.stringify({ fn, args }) });\n"], ["    toast(`${reg} ${total}건 읽음 → ${cats.map(c=>`${c} ${rows.filter(r=>r.cat===c).length}건`).join(' · ')}`);\n  }catch(e){ toast('엑셀 읽기 실패: '+e.message, true); }\n}\n", "    toast(`${reg} ${total}건 읽음 → ${cats.map(c=>`${c} ${rows.filter(r=>r.cat===c).length}건`).join(' · ')}`);\n  }catch(e){ toast('엑셀 읽기 실패: '+e.message, true); }\n}\n/* ────────── 워크라인 연결 (테스트) ──────────\n   워크라인(로그인된 창)에서 북마크를 누르면 이 창이 열리고, 이 창은 window.opener 에게 조회만 부탁함.\n   워크라인 쪽 북마크는 정해진 조회 주소(GET)만 대신 불러서 결과를 돌려줌. */\nconst WL_ORIGIN='https://workline.kr';\nconst wlPend={}; let wlSeq=0;\nconst wlLinked=()=>{ try{ return !!(window.opener && !window.opener.closed); }catch(_){ return false; } };\nwindow.addEventListener('message',e=>{ if(e.origin!==WL_ORIGIN) return; const m=e.data||{}; if(m.t!=='wl-res'||!wlPend[m.id]) return;\n  const p=wlPend[m.id]; delete wlPend[m.id];\n  if(m.error) p.rej(new Error(m.error)); else if(m.status!==200) p.rej(new Error('워크라인 응답 '+m.status+(m.status===401?' (워크라인 로그인이 풀렸어요)':''))); else p.res(m.body); });\nfunction wlGet(path, old){ return new Promise((res,rej)=>{\n  if(!wlLinked()) return rej(new Error('워크라인 창에서 북마크를 눌러 이 창을 열어주세요.'));\n  const id=++wlSeq; wlPend[id]={res,rej}; window.opener.postMessage({t:'wl-get',id,path,old:!!old}, WL_ORIGIN);\n  setTimeout(()=>{ if(wlPend[id]){ delete wlPend[id]; rej(new Error('워크라인 응답이 없어요 (워크라인 창이 열려 있는지 확인)')); } },30000); }); }\nasync function wlAll(params, old){ const out=[];\n  for(let p=1;p<=200;p++){ const q=new URLSearchParams({...params,page:String(p),size:'100'}); const b=await wlGet('/api/exact/calc?'+q.toString(), old);\n    if(!b||!b.success||!b.data) throw new Error('워크라인 조회 실패'); out.push(...(b.data.items||[])); if(p>=((b.data.pagination||{}).totalPages||1)) break; }\n  return out; }\nconst wlMask=s=>{ s=String(s||'').trim(); return s.length>=2 ? s[0]+'*'+s.slice(2) : s; };\nconst wlDate=v=>{ const m=String(v||'').match(/\\d{4}-\\d{2}-\\d{2}/); return m?m[0]:''; };\n// 환수발생: 정산종류=환수, 협력점(시흥 C1714 / 천안 D0053), 정산예정일 = 그 달 15일(시흥) / 25일(천안), 현재+옛날 데이터\nconst WL_DEALER={'시흥':'C1714','천안':'D0053'};\nconst WL_RO_CATS={'시흥':{ret:'26년 이전_퇴사자(팀결산제외)',pre:'26년 이전(팀결산반영)',post:'26년 이후(개별,팀별 반영)'},'천안':{pre:'26년 이전개통(팀결산반영)',post:'26년 이후개통(개별정산서 반영)'}};\nasync function roWorkline(){\n  if(!(await lockGuard(state.ro.month,[state.roRegion],'upload'))) return;\n  const reg=state.roRegion, R=state.ro.regions[reg], m=state.ro.month, dealer=WL_DEALER[reg], C=WL_RO_CATS[reg];\n  if(!dealer){ toast(reg+' 협력점 코드가 없습니다.', true); return; }\n  const date=`${m}-${reg==='시흥'?'15':'25'}`;\n  const params={chargeType:'B',dealerCode:dealer,dateChk:'4',dateFrom:date,dateTo:date};\n  let now0, old0, act;\n  loading(true);\n  try{ [now0, old0, act]=await Promise.all([wlAll(params,false), wlAll(params,true), wlGet('/api/exact/calc/employees?dealerCode='+dealer+'&activeOnly=1')]); }\n  catch(e){ toast(e.message, true); return; } finally{ loading(false); }\n  // 퇴사자 = 워크라인 '재직 사원' 목록(협력점 기준)에 없는 사람. 이름이 '휴'로 시작하면(휴직) 퇴사자 아님\n  const idk=v=>String(v||'').replace(/^\\d+:/,'').toLowerCase();\n  const activeIds=new Set((((act||{}).data||{}).employees||[]).map(e=>idk(e.mId)));\n  const retired=x=>{ const n=String(x.yuchiName||''); if(/^퇴/.test(n)) return true; if(/^휴/.test(n)) return false; return !activeIds.has(idk(x.yuchiMId)); };\n  const rows=[...now0,...old0].map(x=>{ const open=wlDate(x.openDate), emp=String(x.yuchiName||'').trim();\n    const pre=open && +open.slice(0,4)<2026;     // 개통일 빈 건 → 26년 이후\n    const cat=pre ? (C.ret && retired(x) ? C.ret : C.pre) : C.post;\n    return {cat,emp,customer:wlMask(x.customerName),product:[x.articleName,x.articleName1].filter(Boolean).join('_'),option:x.optionName||'',open,status:x.gaetongName||'',memo:x.chargeBigo||'',amount:Number(x.chargeSum)||0}; });\n  const cats=Object.values(C).filter(c=>rows.some(r=>r.cat===c));\n  const order=Object.values(C); rows.sort((a,b)=>order.indexOf(a.cat)-order.indexOf(b.cat)||String(a.emp).localeCompare(String(b.emp),'ko'));\n  // 이미 저장된 '제외'는 같은 건(유치자·금액·개통일·상품)이면 이어받음\n  const prev=(state.roSaved.regions[reg]||{rows:[]}).rows||[]; const key=r=>[normName(r.emp),r.amount,r.open,r.product].join('|');\n  const exMap={}; prev.filter(r=>r.ex).forEach(r=>exMap[key(r)]=r.reason||'제외');\n  let carried=0; rows.forEach(r=>{ const k=key(r); if(k in exMap){ r.ex=true; r.reason=exMap[k]; delete exMap[k]; carried++; } });\n  // 저장된 값과 비교\n  const W=n=>(Number(n)||0).toLocaleString('ko-KR');\n  const S=(list,f)=>{ const l=list.filter(f); return `${l.length}건 ${W(l.reduce((a,r)=>a+(Number(r.amount)||0),0))}원`; };\n  const Rs={summary:R.summary};\n  const lines=[`정산예정일 ${date} · 현재 ${now0.length}건 + 옛날 ${old0.length}건 = ${rows.length}건`, '',\n    `[워크라인]  전체 ${S(rows,()=>true)}`, ...cats.map(c=>`   · ${roShort(c)}: ${S(rows,r=>r.cat===c)}`)];\n  if(prev.length){ lines.push('', `[지금 저장된 값]  전체 ${S(prev,()=>true)}`, ...roCats(Rs.summary?{summary:Rs.summary,rows:prev}:{rows:prev}).map(c=>`   · ${roShort(c)}: ${S(prev,r=>r.cat===c)}`));\n    const same=rows.length===prev.length && rows.reduce((a,r)=>a+r.amount,0)===prev.reduce((a,r)=>a+r.amount,0);\n    lines.push('', same?'✔ 전체 건수·금액이 저장된 값과 같아요.':'⚠ 저장된 값과 달라요. 확인 후 적용하세요.'); }\n  if(carried) lines.push(`저장돼 있던 제외 ${carried}건은 그대로 이어받았어요.`);\n  const d=await dlg({title:`${reg} 환수발생 · 워크라인 가져오기`, desc:lines.join('\\n'), ok:'화면에 적용'});\n  if(!d.ok) return;\n  if(!state.edit) setEdit(true);\n  const kinds={}; cats.forEach(c=>{ const k=R.summary&&R.summary.kinds&&R.summary.kinds[c]; if(k) kinds[c]=k; });\n  R.rows=rows; R.summary={total:rows.length,file:`워크라인 ${date} (현재 ${now0.length} + 옛날 ${old0.length})`,cats,kinds}; state.roOpen={}; renderOccur();\n  toast(`${reg} ${rows.length}건 가져옴 — 확인 후 저장을 누르세요.`);\n}\n"], ["  if(ed||!R.summary) l+=`<div class=\"upl\" id=\"roDrop\" ${state.editor?'':'style=\"display:none\"'}><b>${reg}<\/b> 환수리스트 엑셀 <label style=\"cursor:pointer\"><b><u>파일 선택<\/u><\/b><input type=\"file\" accept=\".xlsx,.xls\" style=\"display:none\" onchange=\"roFile(this.files[0]);this.value=''\"><\/label><div class=\"sub\" style=\"margin-top:4px\">시트별로 구분해서 읽습니다 ('전체' 시트는 건너뜀)${R.summary?' · 다시 올리면 덮어씀':''}<\/div><\/div>`;\n", "  if(ed||!R.summary) l+=`<div class=\"upl\" id=\"roDrop\" ${state.editor?'':'style=\"display:none\"'}><b>${reg}<\/b> 환수리스트 엑셀 <label style=\"cursor:pointer\"><b><u>파일 선택<\/u><\/b><input type=\"file\" accept=\".xlsx,.xls\" style=\"display:none\" onchange=\"roFile(this.files[0]);this.value=''\"><\/label><div class=\"sub\" style=\"margin-top:4px\">시트별로 구분해서 읽습니다 ('전체' 시트는 건너뜀)${R.summary?' · 다시 올리면 덮어씀':''}<\/div><div style=\"margin-top:10px\"><button class=\"btn\" onclick=\"roWorkline()\">워크라인에서 바로 가져오기<\/button><div class=\"sub\" style=\"margin-top:4px\">${wlLinked()?'<b style=\"color:var(--ok,#2b8a3e)\">워크라인 창 연결됨<\/b>':'워크라인 창에서 북마크를 눌러 이 창을 열어야 합니다'}<\/div><\/div><\/div>`;\n"]];
(async () => {
  try {
    const res = await fetch('../settle/index.html', { cache: 'no-store' });
    let h = await res.text();
    h = h.replace(/const BUILD='[^']*';/, "const BUILD='s1021-80';");   // 실제 웹 빌드 번호가 바뀌어도 붙도록
    const miss = [];
    PATCH.forEach(([a, b], i) => { if (h.indexOf(a) < 0) miss.push(i + 1); else h = h.replace(a, () => b); });
    if (miss.length) throw new Error('실제 웹이 바뀌어서 테스트 수정 ' + miss.join(',') + '번을 못 붙였어요. 다시 만들어야 해요.');
    document.open(); document.write(h); document.close();
    // 테스트 데이터 비우기 버튼 (설정·팀·사원은 남김)
    const btn = document.createElement('button');
    btn.textContent = '테스트 데이터 비우기';
    btn.style.cssText = 'position:fixed;right:10px;bottom:26px;z-index:10000;background:#e8590c;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer';
    btn.onclick = async () => {
      if (!confirm('테스트 웹의 데이터를 모두 비울까요?\n(설정·팀·사원은 남고, 실제 정산관리는 영향 없어요)')) return;
      btn.disabled = true; btn.textContent = '비우는 중…';
      try {
        const C = window.SETTLE_CONFIG; const { data: { session } } = await sb.auth.getSession();
        if (!session) throw new Error('먼저 로그인하세요.');
        const r = await fetch(C.url + '/functions/v1/settle-test-reset', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: C.anonKey, Authorization: 'Bearer ' + session.access_token }, body: '{}' });
        const j = await r.json(); if (!j.ok) throw new Error(j.error || '실패');
        alert('비웠어요. 화면을 새로 불러올게요.'); location.reload();
      } catch (e) { alert('실패: ' + (e.message || e)); btn.disabled = false; btn.textContent = '테스트 데이터 비우기'; }
    };
    document.body.appendChild(btn);
  } catch (e) { document.getElementById('tl').innerHTML = '<b style="color:#c92a2a">테스트 웹을 못 열었어요</b><br>' + String(e.message || e); }
})();
</script></body></html>
