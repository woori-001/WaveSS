<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>정산 관리</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28.5C7 22.3 2.5 17.2 2.5 11.4 2.5 7.2 5.8 4 9.8 4c2.6 0 4.8 1.3 6.2 3.4C17.4 5.3 19.6 4 22.2 4c4 0 7.3 3.2 7.3 7.4 0 5.8-4.5 10.9-13.5 17.1z' fill='%234a90e2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ── 탁상달력 톤: 종이 + 잉크 블루 ── */
  :root{
    --desk:#dce6f4;--paper:#fffdfa;--ink:#2f63b8;--ink-d:#244f95;--ink-l:#9fb8dd;
    --rule:#cfdcef;--rule2:#e6edf7;--dot:#c9d7ea;
    --tx:#2a3340;--tx2:#5c6a7e;--tx3:#93a0b3;
    --t1:#f0f5fd;--t2:#eaf1fb;--t3:#f4f7fc;--t4:#e9f0fa;--t5:#f6f9fd;--t6:#eef4fc;--t7:#e3ecfb;--t8:#dfe9f8;--t9:#c3d8f2;--t10:#b9c9e2;--t11:#fafcff;--t12:#f1f5fb;--hue:214;--sat:70;
    --danger:#d63a31;--sideW:180px;--tabH:56px;
  }
  /* 팀손익 결산 */
  .gridC{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
  @media (max-width:1100px){ .gridC{grid-template-columns:1fr} }
  .cldoc{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
  .clbox{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:12px 14px;width:fit-content;max-width:100%;overflow-x:auto}
  .cltog{display:flex;gap:10px;align-items:center;padding:0 0 10px}
  .clin{width:110px;text-align:right;border:1px solid var(--rule);border-radius:4px;padding:3px 6px;font-variant-numeric:tabular-nums;background:#fff;outline:none}.clin:focus{border-color:var(--ink)}td.ovd{background:#fff4d6!important}td.ovd .clin{border-color:#c9a227}
  .tt.clv tr.pick{cursor:pointer}.tt.clv tr.pick:hover td{background:var(--t5)}.tt.clv .caret{display:inline-block;width:14px;color:var(--ink);font-size:11px}
  .tt.clv tr.cldet td{padding:6px 8px 14px 22px;background:var(--t11)}.cldetw{max-width:100%;overflow-x:auto}
  .tt.cld{font-size:12px;width:auto;background:#fff}.tt.cld th,.tt.cld td{padding:5px 8px;white-space:nowrap}.tt.cld tr.bad td:nth-child(3){font-weight:600}.tt.cld tr.file td:first-child,.tt.cld tr.saved td:first-child{white-space:nowrap}
  .vs{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;background:#fbe9e9;color:var(--danger);font-weight:600}
  .tt.cl{width:auto}.tt.cl th{white-space:nowrap}.tt.cl td{padding:7px 12px}.tt.cl td.fin{background:var(--t3)}.tt.cl .neg{color:var(--danger)}
  .clmark{display:inline-block;margin-left:4px;font-size:11px;font-weight:700}.clmark.ok{color:#3f7d58}.clmark.warn{color:#c9a227}.clmark.bad{color:var(--danger)}
  .clnotes{min-width:240px;padding:10px 4px;font-size:13px}.cln{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px dashed var(--rule)}.cln .neg{color:var(--danger)}
  .clrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 30px;gap:6px;align-items:center;margin-top:6px}.clrow input{border:1px solid var(--rule);border-radius:4px;padding:5px 8px;background:#fff;outline:none}.clrow input:focus{border-color:var(--ink)}.clrow input.num{text-align:right}
  .clfilter{padding:6px 0 10px}.clfilter .chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--tx2);cursor:pointer}
  .tt.clv{font-size:12.5px}.tt.clv th{text-align:center}.tt.clv thead tr:first-child th{border-bottom:1px solid var(--rule)}.tt.clv td.d{font-weight:600}.tt.clv td.d.ok{color:var(--tx3);font-weight:400}.tt.clv td.d.warn{color:#c9a227}.tt.clv td.d.bad{color:var(--danger);background:#fbe9e9}.tt.clv tr.bad td:first-child{color:var(--danger);font-weight:600}
  /* 팀손익 결산: 세이지 테마 (CSS 변수만 교체) */
  body.theme-sage{--desk:#dde8de;--paper:#fbfdfa;--ink:#3f7d58;--ink-d:#326446;--ink-l:#a3c4ae;--rule:#d0dfd3;--rule2:#e5eee7;--dot:#c8d9cc;
    --t1:#f0f6f1;--t2:#e8f1ea;--t3:#f3f7f4;--t4:#e7f0e9;--t5:#f5f9f6;--t6:#edf4ee;--t7:#e2eee5;--t8:#dce9df;--t9:#c2dac9;--t10:#b7ccbd;--t11:#f9fcfa;--t12:#f0f6f2;--hue:145;--sat:34}
  .login{position:fixed;inset:0;background:var(--desk);display:flex;align-items:center;justify-content:center;z-index:200}
  .lbox{background:#fff;border-radius:12px;padding:34px 36px;width:380px;max-width:calc(100% - 32px);box-shadow:0 18px 50px rgba(30,50,90,.18)}
  .lbrand{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:6px}.lbox .sub{margin:0 0 18px;line-height:1.5}
  .lbox .btn.lg{width:100%;height:42px;font-size:14.5px}.lor{display:flex;align-items:center;gap:10px;color:var(--tx3);font-size:12px;margin:18px 0 10px}.lor::before,.lor::after{content:"";flex:1;height:1px;background:var(--rule)}
  .lrow{display:flex;gap:6px;margin-top:8px}.lrow input{flex:1;border:1px solid var(--rule);border-radius:6px;padding:8px 10px;outline:none}.lrow input:focus{border-color:var(--ink)}
  .lbox .err{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:8px}
  .side .who{cursor:pointer}.side .who:hover{color:var(--ink);text-decoration:underline}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--desk);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--tx)}
  button{cursor:pointer}
  textarea{border:1px solid var(--rule);border-radius:4px;padding:6px 9px;width:100%;outline:none;line-height:1.5;background:#fff}
  textarea:focus{border-color:var(--ink)}
  .sub{font-size:12.5px;color:var(--tx3)}
  .cap{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}

  /* ── 사이드바 ── */
  .side{position:fixed;top:0;bottom:0;left:0;width:var(--sideW);background:#fff;border-right:1px solid var(--rule);padding:0 10px 14px;display:flex;flex-direction:column;z-index:70}
  .side .brand{font-size:15px;font-weight:600;letter-spacing:.02em;padding:20px 10px 14px;margin-bottom:6px;border-bottom:1px solid var(--rule2);color:var(--ink-d)}
  .side .brand{display:flex;align-items:center;gap:9px}.side .brand .logo{width:30px;height:20px;object-fit:contain;flex:none}
  .side .sidebot{margin-top:auto;padding-top:10px;border-top:1px solid var(--rule2)}
  .side .who{padding:6px 10px 0}
  body.booting .side,body.booting .head,body.booting .tabs,body.booting .main{visibility:hidden}
  .side .divider{height:1px;background:var(--rule2);margin:8px 8px 4px}
  .fold{margin-top:4px}
  .fold .item.grp{color:var(--tx2);white-space:nowrap}
  .fold .item.grp .arw{margin-left:auto;color:#c3cbd8;font-size:14px;transition:transform .15s}
  .fold.open .item.grp .arw{transform:rotate(90deg)}
  .fold .fo{display:none}.fold.open .fo{display:block}.fold.open .fc{display:none}
  .fold.on .item.grp{color:var(--ink-d);font-weight:600}
  .fold .subs{display:none}.fold.open .subs{display:block}
  .side .item.sub{padding:6px 10px 6px 22px;font-size:13px}
  .side .item.sub::before{content:'·';color:var(--ink-l);font-weight:900;font-size:18px;line-height:1;width:6px}
  .side .item.sub.on::before{color:var(--ink)}
  .side .item{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:8px 10px;color:var(--tx2);border-radius:6px;font-weight:500}
  .side .item svg{width:15px;height:15px;flex:none}
  .side .item:hover{background:var(--t12);color:var(--tx)}
  .side .item.on{color:var(--ink-d);font-weight:700;background:var(--t4)}

  .btn{height:32px;padding:0 12px;border:1px solid var(--rule);background:#fff;border-radius:6px;color:var(--tx2);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
  .btn:hover{border-color:var(--ink-l);color:var(--ink-d)}
  .btn.pri{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .btn.pri:hover{background:var(--ink-d);color:#fff}
  .btn.sm{height:26px;padding:0 9px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.danger{color:var(--danger)}

  /* ── 상단 고정: 큰 월 + 버튼 ── */
  .head{position:fixed;top:0;left:var(--sideW);right:0;height:84px;background:var(--desk);z-index:50;padding:0 32px;display:flex;align-items:center;gap:14px}
  .head .mon{display:flex;align-items:baseline;gap:12px}
  .head .mon .num{font-size:46px;font-weight:200;color:var(--ink);letter-spacing:-.03em;line-height:1}
  .head .mon .name{display:flex;flex-direction:column;line-height:1.25}
  .head .mon .name .en{font-size:12px;font-weight:600;letter-spacing:.22em;color:var(--ink);text-transform:uppercase}
  .head .mon .name .ko{font-size:13px;color:var(--tx2)}
  .head .diff{font-size:12px;font-weight:600;color:var(--ink-d);background:#fff;border:1px solid var(--rule);border-radius:999px;padding:3px 11px;margin-left:6px}
  .head .diff.has{background:var(--ink);border-color:var(--ink);color:#fff}
  .head .editing{font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--ink);border-radius:999px;padding:3px 11px}
  .head .spacer{flex:1}

  /* ── 종이 페이지 ── */
  .main{margin-left:var(--sideW);padding:84px 32px calc(var(--tabH) + 28px)}
  .page{background:var(--paper);border-radius:6px;box-shadow:0 1px 0 #fff inset,0 10px 30px rgba(47,99,184,.10),0 1px 2px rgba(47,99,184,.08);padding:34px 30px 26px;position:relative;min-height:calc(100vh - 84px - var(--tabH) - 28px)}
  .page::before{content:"";position:absolute;top:-9px;left:24px;right:24px;height:18px;background:radial-gradient(circle at 6px 9px,var(--t10) 0 3.2px,var(--t4) 3.6px 4.6px,transparent 5px) 0 0/22px 18px repeat-x}
  .grid3{display:grid;grid-template-columns:250px minmax(0,1fr) 470px;gap:0 34px;align-items:start}

  /* 섹션 공통: 대문자 소제목 + 밑줄 */
  .sec{display:flex;align-items:baseline;gap:8px;padding-bottom:7px;border-bottom:1px solid var(--ink-l);margin-bottom:2px}
  .sec .cap{flex:none}
  .sec .ko{font-size:13.5px;font-weight:600;color:var(--tx)}
  .sec .cnt{margin-left:auto;font-size:11px;color:var(--tx3);letter-spacing:.1em}
  .block{margin-bottom:30px}

  /* 괘선 목록 */
  .rowi{display:grid;grid-template-columns:190px 86px minmax(0,1fr);gap:0 12px;padding:10px 4px;border-bottom:1px solid var(--rule);align-items:start}
  .rowi.mark{background:var(--t1);box-shadow:inset 3px 0 0 var(--ink)}
  .rowi .ri{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
  .rowi .ri b{font-weight:600;word-break:keep-all}
  .rowi .ra{font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .rowi .rb{color:var(--tx2);white-space:pre-wrap;word-break:keep-all;font-size:13.5px;line-height:1.5}
  .rowi .rb .memo{display:block;font-size:12.5px;color:var(--tx3);margin-top:2px}
  .rowi.r2{grid-template-columns:130px minmax(0,1fr)}
  .removed{padding:8px 4px 0;font-size:12.5px;color:var(--tx3)}
  .removed s{color:#b3b9c3}
  .tag{display:inline-block;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--ink-l);color:var(--ink-d);white-space:nowrap;line-height:19px;background:#fff}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--ink);color:#fff;line-height:18px}

  /* 금액 박스 */
  .hero{display:flex;flex-direction:column;gap:10px;padding-top:12px}
  .card{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:12px 16px 12px;position:relative;display:flex;flex-direction:column;min-width:0}
  .card.mark{border-color:var(--ink)}
  .card .ch{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card .ch b{font-weight:600}
  .card .amt{font-size:26px;font-weight:300;color:var(--ink);letter-spacing:-.02em;line-height:1.2;margin:6px 0 4px}
  .card .body{color:var(--tx2);white-space:pre-wrap;word-break:keep-all;line-height:1.5;font-size:13.5px}
  .card .memo{font-size:12.5px;color:var(--tx3);margin-top:4px;white-space:pre-wrap}
  .card .body:empty{display:none}
  .card.add{border-style:dashed;align-items:center;justify-content:center;color:var(--ink);font-weight:600;cursor:pointer;min-height:52px;background:transparent}
  .card.add:hover{background:var(--t1)}

  /* 특이사항: ○ 체크 줄 + 점 배경 */
  .notes{padding-top:6px}
  .notes .mi{display:flex;gap:9px;align-items:flex-start;line-height:1.55;font-size:13.5px;padding:8px 2px;border-bottom:1px solid var(--rule)}
  .notes .mi .n{flex:none;width:12px;height:12px;border:1.5px solid var(--ink-l);border-radius:50%;margin-top:5px}
  .notes .mi textarea{flex:1}
  .notes .none{color:var(--tx3);padding:10px 2px;border-bottom:1px solid var(--rule)}
  .notes .dots{height:96px;margin-top:10px;background:radial-gradient(circle,var(--dot) 1px,transparent 1.4px) 0 0/12px 12px}

  /* ── 하단 월 탭 ── */
  .tabs{position:fixed;left:var(--sideW);right:0;bottom:0;height:var(--tabH);background:var(--desk);z-index:60;padding:0 32px;display:flex;align-items:flex-end;gap:10px}
  .tabs .yr{display:flex;align-items:center;gap:6px;margin-bottom:12px;color:var(--ink-d);font-weight:600;font-size:13px}
  .tabs .yr button{border:1px solid var(--rule);background:#fff;border-radius:6px;width:26px;height:26px;color:var(--tx2);line-height:1}
  .tabs .yr button:hover{color:var(--ink)}
  .tabs .strip{flex:1;display:flex;gap:3px;align-items:flex-end;height:100%}
  .tabs .t{flex:1;height:38px;border:0;border-radius:6px 6px 0 0;color:#fff;font-weight:600;font-size:12px;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:5px;transition:height .12s;position:relative;opacity:.95}
  .tabs .t .m{font-size:13.5px;font-weight:700}
  .tabs .t .e{font-size:10px;letter-spacing:.12em;opacity:.85}
  .tabs .t:hover{height:44px;opacity:1}
  .tabs .t.on{background:var(--paper);color:var(--ink);height:50px;opacity:1;box-shadow:0 -4px 12px rgba(47,99,184,.12)}
  .tabs .t.has::after{content:"";position:absolute;right:7px;top:7px;width:5px;height:5px;border-radius:50%;background:#fff}
  .tabs .t.on.has::after{background:var(--ink)}
  .tabs .today{margin-bottom:12px}

  /* 편집 */
  textarea.ce{border:1px solid var(--rule);background:#fff;border-radius:4px;padding:5px 8px;width:100%;min-height:30px;resize:none;overflow:hidden;display:block;font-size:13.5px}
  textarea.ce:focus{border-color:var(--ink)}
  textarea.ce.k{font-weight:600}
  textarea.ce.tg{font-size:12.5px}
  textarea.ce.num{font-weight:600;color:var(--ink)}
  textarea.ce.small{font-size:12.5px;color:var(--tx3)}
  .stack{display:flex;flex-direction:column;gap:5px;min-width:0}
  .ops{display:flex;gap:2px;justify-content:flex-end}
  .ops button{border:1px solid var(--rule);background:#fff;border-radius:4px;height:22px;min-width:22px;padding:0 4px;font-size:10px;color:var(--tx2)}
  .ops button:hover{color:var(--ink);border-color:var(--ink-l)}
  .rowi.ed{grid-template-columns:160px 96px minmax(0,1fr) 78px}
  .rowi.ed.r2{grid-template-columns:minmax(0,1fr);gap:5px}
  .rowi.ed.r2 .ops{justify-content:flex-start}
  .card .ops{position:absolute;top:8px;right:8px}
  .card .row{display:flex;gap:6px;margin-bottom:5px;min-width:0}
  .card .row .grow{flex:1}
  body.edit .card:not(.add){padding-top:34px}
  .addrow{padding:10px 4px}
  .editbtn{border:1px solid var(--ink-l);background:#fff;border-radius:4px;height:24px;padding:0 9px;font-size:12px;font-weight:600;color:var(--ink)}
  .editbtn:hover{background:var(--t1)}

  /* ── 패널티 / 설정 ── */
  .grid2{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0 34px;align-items:start}
  .gridS{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0 34px;align-items:start}
  .sum{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--rule)}
  .sum .amt{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .sum .amt.zero{color:var(--tx3);font-weight:500}
  .sum.reg{background:var(--t3);margin-top:6px;padding-left:8px;padding-right:8px;border-radius:4px;border-bottom:0}.sum.reg b{color:var(--ink-d)}
  .sum.total{border-bottom:0;border-top:1px solid var(--ink-l);margin-top:4px;padding-top:12px}
  .sum.total b{font-size:15px}
  .sum.total .amt{font-size:20px;font-weight:300}
  .pl{display:grid;grid-template-columns:96px 90px 100px 150px minmax(0,1fr) 110px 150px;gap:0 10px;align-items:start;padding:9px 4px;border-bottom:1px solid var(--rule)}
  .pl.hd{padding:4px 4px 6px;border-bottom:1px solid var(--ink-l)}
  .pl.hd span{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase}
  .pl b{font-weight:600}
  .pl .amt{font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .pl .note{color:var(--tx3);font-size:12.5px;white-space:pre-wrap}
  .pl.ed{grid-template-columns:96px 130px 100px 150px minmax(0,1fr) 110px 150px 78px;align-items:start}
  .pl select,.pl input{border:1px solid var(--rule);border-radius:4px;padding:5px 7px;width:100%;background:#fff;font-size:13.5px;outline:none;height:30px}
  .pl select:focus,.pl input:focus{border-color:var(--ink)}
  .pl input.num{text-align:right}
  .pl .teamv{padding-top:4px}
  .empty-row{padding:14px 4px;color:var(--tx3);border-bottom:1px solid var(--rule)}
  .sl{display:grid;grid-template-columns:34px minmax(0,1fr) 78px;gap:0 10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--rule)}
  .sl .no{color:var(--tx3);font-size:12px}
  .se{display:grid;grid-template-columns:30px 110px 80px 120px 84px minmax(220px,1fr) 78px;gap:0 10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--rule)}
  .se .no{color:var(--tx3);font-size:12px}
  .se .st{font-size:12px;color:var(--tx3)}
  .se .st.off{color:var(--danger)}
  .sl.pick{cursor:pointer;border-radius:6px}
  .sl.pick:hover{background:var(--t1)}
  .sl.pick.on{background:var(--t4)}
  .sl.pick.on .tag{background:var(--ink);color:#fff;border-color:var(--ink)}
  .filt{font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--ink-l);border-radius:999px;padding:1px 9px;margin-left:8px;cursor:pointer}
  .sl input,.se input,.se select{border:1px solid var(--rule);border-radius:4px;padding:5px 7px;width:100%;background:#fff;font-size:13.5px;outline:none;height:30px}
  .sl input:focus,.se input:focus,.se select:focus{border-color:var(--ink)}
  body.v-settings .tabs{display:none}
  body.v-settings .main{padding-bottom:40px}
  .doc.capture .pl{grid-template-columns:90px 80px 90px 130px minmax(0,1fr) 100px 130px}

  /* ── 와이즐리 ── */

  .aj{display:grid;grid-template-columns:minmax(0,1fr) 50px 100px 100px 120px;gap:0 10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--rule)}
  .aj.hd{padding:4px 4px 6px;border-bottom:1px solid var(--ink-l)}
  .aj.hd span{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase}
  .aj .r{text-align:right;font-variant-numeric:tabular-nums}
  .aj .neg{color:var(--danger)}
  .aj .amt{font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .aj .amt input.num{width:100px;text-align:right;border:1px solid var(--rule);border-radius:4px;padding:4px 7px;height:28px;font-size:13.5px;outline:none}
  .aj .amt input.num:focus{border-color:var(--ink)}
  .aj.gh{background:var(--t3);padding:9px 4px;margin-top:6px}
  .aj.gh b{color:var(--ink-d)}
  .aj .c{padding-left:10px}
  .aj.done{color:var(--tx2)}
  .aj.tot{background:var(--t2);font-weight:700;color:var(--ink-d)}
  .aj.tot .amt{font-weight:800}
  .doc.capture .aj{grid-template-columns:minmax(0,1fr) 50px 100px 100px 120px}
  .emp{display:grid;grid-template-columns:minmax(0,1fr) 60px 120px;gap:0 8px;padding:6px 4px;border-bottom:1px solid var(--rule2);font-size:13px}
  .emp .r{text-align:right;font-variant-numeric:tabular-nums}

  /* PNG */
  .doc{display:none}
  .doc.capture{display:block;width:1000px;padding:28px 30px;background:#fff}
  .doc.capture .block{margin-bottom:22px}
  .doc.capture .hero{display:grid;grid-template-columns:1fr 1fr}
  .doc.capture .ops,.doc.capture .card.add,.doc.capture .addrow,.doc.capture .dots{display:none}
  .empty{text-align:center;color:var(--tx3);padding:56px 0}

  @media (max-width:1200px){ .grid3{grid-template-columns:230px minmax(0,1fr)} .grid3 > :nth-child(3){grid-column:2} }
  @media (max-width:900px){ .side{display:none} .head,.tabs{left:0;padding:0 12px} .main{margin-left:0;padding:84px 12px calc(var(--tabH) + 20px)} .grid3{grid-template-columns:1fr} .grid3 > :nth-child(3){grid-column:1} }

  /* 이미지 보관 */
  .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .img-card{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
  .img-card .nm{font-weight:600;word-break:break-all}
  .img-card .ops{display:flex;gap:5px;margin-top:10px}
  .drop{border:1.5px dashed var(--t9);background:#fff;border-radius:10px;padding:24px;text-align:center;color:var(--tx2);margin-bottom:14px}
  .viewer{position:fixed;inset:0;background:rgba(20,22,26,.75);display:none;align-items:center;justify-content:center;z-index:120;padding:20px}
  .viewer img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}

  /* 더보기 · 모달 · 토스트 */
  .more{position:relative}
  .menu{position:absolute;right:0;top:38px;background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(20,22,26,.12);min-width:170px;padding:6px;display:none;z-index:70}
  .menu.on{display:block}
  .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;color:var(--tx2)}
  .menu button:hover{background:var(--t1);color:var(--tx)}
  .menu button.danger{color:var(--danger)}
  .menu .sep{height:1px;background:var(--rule2);margin:4px 0}
  .mask{position:fixed;inset:0;background:rgba(20,22,26,.4);display:none;align-items:center;justify-content:center;z-index:130;padding:20px}
  .mask.on{display:flex}
  .modal{background:#fff;border-radius:10px;width:100%;max-width:360px;padding:24px;box-shadow:0 16px 44px rgba(20,22,26,.18)}
  .modal h4{margin:0 0 4px;font-size:16px;font-weight:700}
  .modal p{margin:0 0 16px;color:var(--tx3);line-height:1.55;white-space:pre-line}
  .modal .fld{margin-bottom:12px}
  .modal .fld label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:5px}
  .modal input[type=text]{height:37px;padding:0 12px;width:100%;border:1px solid var(--rule);border-radius:6px;outline:none}
  .modal input[type=text]:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(47,99,184,.15)}
  .modal .chk{display:flex;align-items:center;gap:7px;color:var(--tx2);margin-bottom:6px}
  .modal .chk input{margin:0}
  .modal .err{color:var(--danger);font-size:12px;min-height:17px;margin-top:6px}
  .modal .row{display:flex;gap:8px;margin-top:14px}
  .modal .row .btn{flex:1;height:37px;justify-content:center}
  .modal .btn.pri.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1d23;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}.toast.err{background:var(--danger)}
  .loading{position:fixed;top:0;left:0;right:0;height:3px;background:var(--ink);display:none;z-index:100}
  .loading.on{display:block;animation:ld 1s infinite alternate}
  @keyframes ld{from{opacity:.3}to{opacity:1}}
  .empty{text-align:center;color:var(--tx3);padding:56px 0}

  @media (max-width:1100px){ .main{grid-template-columns:240px minmax(0,1fr)} .col3{grid-column:2} }
  @media (max-width:900px){ .side{display:none} .head{left:0;padding:0 12px} .main{margin-left:0;padding:64px 12px 60px;grid-template-columns:1fr} .col1{position:static} .mp{width:100%} .col3{grid-column:1} }
</style>
</head>

<script>
const BUILD='s1008-73';   // 배포 확인용 빌드 표시 (s = Supabase 버전)
/* ────────── 서버 호출 ────────── */
/* Supabase: 로그인은 supabase-js, 데이터는 Edge Function(settle-api) 한 곳으로 */
const CFG = window.SETTLE_CONFIG || {};
const sb = (window.supabase && CFG.url) ? window.supabase.createClient(CFG.url, CFG.anonKey) : null;
const api = async (fn, ...args) => {
  if (window.__mock) { await new Promise(r => setTimeout(r, 50)); if (window.__mock[fn]) return window.__mock[fn](...args); throw new Error('no mock ' + fn); }
  loading(true);
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('로그인이 필요합니다.');
    const res = await fetch(`${CFG.url}/functions/v1/settle-api`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': CFG.anonKey, 'Authorization': 'Bearer ' + session.access_token }, body: JSON.stringify({ fn, args }) });
    let j = null; try { j = await res.json(); } catch (_) {}
    if (!j) throw new Error('서버 응답 오류 (' + res.status + ')');
    if (!j.ok) throw new Error(j.error || '오류');
    return j.result;
  } finally { loading(false); }
};
function loading(on){ document.getElementById('loading').classList.toggle('on', !!on); }

function dlg(o){
  return new Promise(resolve=>{
    $('md_title').textContent=o.title||''; $('md_desc').textContent=o.desc||'';
    $('md_fld').style.display=o.input?'':'none';
    if(o.input){ $('md_label').textContent=o.input.label||''; $('md_input').value=o.input.value||''; $('md_input').placeholder=o.input.placeholder||''; }
    $('md_chk').style.display=o.check?'':'none';
    if(o.check){ $('md_chklabel').textContent=o.check.label; $('md_check').checked=!!o.check.checked; }
    $('md_checks').innerHTML=(o.checks||[]).map(c=>`<label class="chk"><input type="checkbox" data-key="${c.key}" ${c.checked?'checked':''}>${esc(c.label)}</label>`).join('');
    $('md_err').textContent=''; $('md_ok').textContent=o.ok||'확인'; $('md_ok').className='btn pri'+(o.danger?' danger':'');
    $('mask').classList.add('on');
    if(o.input) setTimeout(()=>{ $('md_input').focus(); $('md_input').select(); },30);
    const close=v=>{ $('mask').classList.remove('on'); $('md_ok').onclick=null; $('md_cancel').onclick=null; $('md_input').onkeydown=null; document.onkeydown=null; resolve(v); };
    const submit=()=>{ const val=$('md_input').value.trim(); if(o.validate){ const e=o.validate(val); if(e){ $('md_err').textContent=e; return; } }
      const checks={}; document.querySelectorAll('#md_checks input').forEach(i=>checks[i.dataset.key]=i.checked); close({ok:true, value:val, check:$('md_check').checked, checks}); };
    $('md_ok').onclick=submit; $('md_cancel').onclick=()=>close({ok:false});
    $('md_input').onkeydown=e=>{ if(e.key==='Enter') submit(); };
    document.onkeydown=e=>{ if(e.key==='Escape') close({ok:false}); else if(e.key==='Enter'&&!o.input) submit(); };
  });
}
function toggleFold(g){ const el=document.querySelector(`.side .fold[data-grp=${g}]`); el.classList.toggle('open'); try{ localStorage.setItem('fold_'+g, el.classList.contains('open')?'1':'0'); }catch(e){} }

/* ────────── 상태 ────────── */
let state = { user:'', editor:false, months:[], month:null, data:null, saved:null, edit:false, tab:'doc', exportSel:null, year:new Date().getFullYear(), viewMonth:null, cache:{},
  view:'criteria', locks:{}, settings:{teams:[],employees:[]}, teamFilter:'', sset:null, pen:null, penSaved:null, penMonths:[], penCache:{}, wz:null, wzSaved:null, wzMonths:[], wzCache:{}, wzDetailOpen:false, sky:null, skySaved:null, skyMonths:[], skyCache:{}, skyDetailOpen:null, up:null, upSaved:null, upMonths:[], upCache:{}, upDetailOpen:false, adj:null, adjSaved:null, adjMonths:[], adjCache:{}, adjRegion:'시흥', adjOpen:{emp:{},mx:false,ex:false}, bonus:null, bonusSaved:null, bonusMonths:[], bonusCache:{}, bonusRegion:'시흥', bonusOpen:{emp:{},mx:false}, ind:null, indSaved:null, indMonths:[], indCache:{}, indRegion:'시흥', indEmp:null, indDetails:{}, indDetailOpen:false, appr:null, apprSaved:null, apprMonths:[], apprCache:{}, rf:null, rfSaved:null, rfMonths:[], rfCache:{}, rfOpen:{emp:{},col:{},x:{}}, ro:null, roSaved:null, roMonths:[], roCache:{}, roRegion:'시흥', roOpen:{}, cl:null, clSaved:null, clMonths:[], clCache:{}, clOpen:{}, clOnlyDiff:true };
const clone = o => JSON.parse(JSON.stringify(o));
const ym = (y,m) => `${y}-${String(m).padStart(2,'0')}`;
const thisMonth = () => { const d=new Date(); return ym(d.getFullYear(), d.getMonth()+1); };

async function init(){
  document.body.classList.add('booting');
  try{
    const r = await api('getInit', thisMonth());
    document.body.classList.remove('booting');
    if(r.role==='none'){ $('userinfo').textContent=(r.user||'').split('@')[0]+' · '+BUILD; $('brand').textContent=r.appName; $('empty').innerHTML='<b style="color:var(--danger)">접근 권한이 없습니다</b><br><span class="sub">'+(r.user?esc(r.user)+' 계정은 설정 > 사원에 등록되어 있지 않습니다.':'접속 계정을 확인할 수 없습니다.')+' 관리자에게 문의하세요.</span><br><br><button class="btn" onclick="logout()">다른 계정으로 로그인</button>'; showEmpty(true); document.querySelector('.side').style.display='none'; document.querySelector('.tabs').style.display='none'; return; }
    if(r.role==='emp'){ return initEmp(r); }
    state.user=r.user; state.editor=r.editor; state.months=r.months; state.settings=r.settings||{teams:[],employees:[]}; fillEmpList(); state.penMonths=r.penaltyMonths||[]; state.wzMonths=r.wiselyMonths||[]; state.skyMonths=r.skyMonths||[]; state.upMonths=r.upMonths||[]; state.adjMonths=r.adjMonths||[]; state.bonusMonths=r.bonusMonths||[]; state.indMonths=r.indivMonths||[]; state.apprMonths=r.apprMonths||[]; state.rfMonths=r.refundMonths||[]; state.roMonths=r.occurMonths||[]; state.clMonths=r.closeMonths||[];
    $('brand').textContent = r.appName;
    $('userinfo').textContent = (r.user||'').split('@')[0] + (r.editor?'':' · 읽기전용') + ' · ' + BUILD;
    if(!r.editor) $('editBtns').style.display='none';
    if(!r.editor) document.querySelectorAll('[data-edit]').forEach(el=>{ el.disabled=true; if(el.id==='drop') el.style.display='none'; });
    document.querySelectorAll('[data-only]').forEach(el=>el.style.display=el.dataset.only==='criteria'?'':'none');
    document.querySelector('.side [data-view=criteria]').classList.add('on');

  }catch(e){
    toast('초기화 실패: '+e.message, true);
    $('empty').innerHTML='<b style="color:var(--danger)">초기화 실패</b><br>'+esc(e.message)+'<br><span class="sub">Supabase Edge Function(settle-api) 배포와 config.js 설정을 확인하세요.</span>';

const hasMonth = m => state.months.some(x=>x.month===m);

/* ────────── 월 패널 ────────── */
const EN=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const ENF=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
function tabColor(i){ // 연파랑 → 파랑 그라데이션 (테마별 hue/sat 는 CSS 변수)
  const cs=getComputedStyle(document.body); const h=+cs.getPropertyValue('--hue')||214, sTop=+cs.getPropertyValue('--sat')||70; const t=i/11; const l=(h===214?78:82)-(t*40); return `hsl(${h} ${sTop}% ${l}%)`;
}
function renderPicker(){
  $('mp_year').textContent = state.year;
  const cur = state.viewMonth || '';
  if(state.view==='settings'){ $('mp_big').textContent='설정'; $('mp_en').textContent='SETTINGS'; $('dh_title').textContent='팀 · 사원 관리'; $('dh_diff').style.display='none'; $('dh_saved').textContent=''; return; }
  $('mp_big').textContent = cur ? cur.slice(5) : '—';
  $('mp_en').textContent = cur ? `${ENF[+cur.slice(5)-1]} ${cur.slice(0,4)}` : '';
  const latestM = (state.view==='me'||state.view==='meteam') ? (state.myMonths[0]||{}).month : state.view==='mebonus' ? state.myBonusMonths[0] : state.view==='mecrit' ? (state.myCritMonths||[])[0] : state.view==='penalty' ? state.penMonths[0] : state.view==='wisely' ? state.wzMonths[0] : state.view==='sky' ? state.skyMonths[0] : state.view==='up' ? state.upMonths[0] : state.view==='adj' ? state.adjMonths[0] : state.view==='bonus' ? state.bonusMonths[0] : (state.view==='indiv'||state.view==='team') ? state.indMonths[0] : state.view==='appr' ? state.apprMonths[0] : state.view==='refund' ? state.rfMonths[0] : state.view==='occur' ? state.roMonths[0] : state.view==='close' ? (state.clMonths||[])[0] : state.months[0]?.month;
  $('mp_grid').innerHTML = Array.from({length:12},(_,i)=>{
    const m=ym(state.year,i+1), latest=latestM===m, on=m===cur;
    return `<button class="t ${latest?'has':''} ${on?'on':''}" style="${on?'':'background:'+tabColor(i)}" onclick="selectMonth('${m}')"><span class="m">${i+1}</span><span class="e">${EN[i]}</span></button>`;
  }).join('');
}
function shiftYear(d){ state.year+=d; renderPicker(); }
function goToday(){ state.year=+thisMonth().slice(0,4); selectMonth(thisMonth()); }
async function selectMonth(m){
  if(state.edit && !(await confirmDiscard())) return;
  state.viewMonth=m; state.year=+m.slice(0,4);
  if(state.view==='me'){ await loadMe(m); renderPicker(); return; }
  if(state.view==='meteam'){ await loadMe(m); renderMeTeam(); renderPicker(); return; }
  if(state.view==='mebonus'){ await loadMeBonus(m); renderPicker(); return; }
  if(state.view==='mecrit'){ await loadMeCrit(m); return; }
  if(state.view==='penalty'){ await loadPenalty(m); renderPicker(); return; }
  if(state.view==='wisely'){ await loadWisely(m); renderPicker(); return; }
  if(state.view==='sky'){ await loadSky(m); renderPicker(); return; }
  if(state.view==='up'){ await loadUp(m); renderPicker(); return; }
  if(state.view==='adj'){ await loadAdj(m); renderPicker(); return; }
  if(state.view==='bonus'){ await loadBonus(m); renderPicker(); return; }
  if(state.view==='indiv'){ await loadIndiv(m); renderPicker(); return; }
  if(state.view==='team'){ await loadTeam(m); renderPicker(); return; }
  if(state.view==='appr'){ await loadAppr(m); renderPicker(); return; }
  if(state.view==='refund'){ await loadRefund(m); renderPicker(); return; }
  if(state.view==='occur'){ await loadOccur(m); renderPicker(); return; }
  if(state.view==='close'){ await loadClose(m); renderPicker(); return; }

  if(hasMonth(m)) await loadMonth(m);
  else {
    state.month=null; state.data=null; setEdit(false);
    $('empty').innerHTML = `<b>${esc(m)}</b> 정산 기준이 아직 없습니다.` + (state.editor?`<br><br><button class="btn pri" onclick="newMonth('${m}')">+ ${esc(m)} 만들기</button>`:'');
    showEmpty(true);
  }

}
function showEmpty(on){
  $('empty').style.display=on?'':'none';
  $('head').style.visibility=on?'hidden':'';
  $('grid3').style.display='none'; $('grid2').style.display='none'; $('gridW').style.display='none'; $('gridK').style.display='none'; $('gridU').style.display='none'; $('gridA').style.display='none'; $('gridB').style.display='none'; $('gridI').style.display='none'; $('gridT').style.display='none'; $('gridP').style.display='none'; $('gridR').style.display='none'; $('gridO').style.display='none'; $('gridS').style.display='none'; $('gridC').style.display='none'; $('tab-images').style.display='none';

}

function setEdit(on){ state.edit=on; document.body.classList.toggle('edit', on); $('viewBtns').style.display=on?'none':'inline-flex'; $('editBtns').style.display=on?'inline-flex':'none'; }
function startEdit(){ if(!state.editor) return;

  if(state.view==='appr'){ if(!state.appr) return; setEdit(true); renderAppr(); return; }

  if(!state.data) return; setEdit(true); render(); }
function isDirty(){
  if(state.view==='penalty'){ if(!state.pen) return false; syncPenDom(); return JSON.stringify(state.pen.rows)!==JSON.stringify(state.penSaved.rows); }
  if(state.view==='wisely'){ if(!state.wz) return false; syncWzDom(); return JSON.stringify([state.wz.rows,state.wz.details])!==JSON.stringify([state.wzSaved.rows,state.wzSaved.details]); }

  if(state.view==='up'){ if(!state.up) return false; return JSON.stringify([state.up.rows,state.up.details])!==JSON.stringify([state.upSaved.rows,state.upSaved.details]); }
  if(state.view==='adj'){ if(!state.adj) return false; syncAdjDom(); const r=state.adjRegion; return JSON.stringify(state.adj.regions[r])!==JSON.stringify(state.adjSaved.regions[r]); }
  if(state.view==='bonus'){ if(!state.bonus) return false; const r=state.bonusRegion; return JSON.stringify(state.bonus.regions[r])!==JSON.stringify(state.bonusSaved.regions[r]); }
  if(state.view==='indiv'){ if(!state.ind) return false; const r=state.indRegion; return JSON.stringify(state.ind.regions[r])!==JSON.stringify(state.indSaved.regions[r]); }

/* ────────── 지난달 비교 ────────── */
const FIELDS=['tag','name','amount','body','memo'];
const norm=v=>String(v||'').replace(/\s+/g,' ').trim();
function rowKey(it, seen){ let k = norm(it.name) ? 'n:'+norm(it.name) : 't:'+norm(it.tag); seen[k]=(seen[k]||0)+1; return k+'#'+seen[k]; }
const isLatest=()=>state.months[0]?.month===state.month;   // 최신 달에서만 지난달 비교 표시
function diffSection(sec){
  const cur=state.data.sections[sec]||[], prev=state.data.prev?.sections?.[sec];
  if(!prev || !isLatest()) return {rows:cur.map(()=>null), removed:[]};
  const ps={}, pmap={}; prev.forEach(it=>{ pmap[rowKey(it,ps)]=it; });
  const cs={}, used={};
  const rows=cur.map(it=>{ const k=rowKey(it,cs); const p=pmap[k]; if(!p) return 'new'; used[k]=1; return FIELDS.some(f=>norm(it[f])!==norm(p[f])) ? 'chg' : null; });
  return {rows, removed:Object.keys(pmap).filter(k=>!used[k]).map(k=>pmap[k])};
}
function diffSummary(){
  if(!isLatest()) return {label:'', cls:''};
  if(!state.data.prev) return {label:'비교할 이전 월 없음', cls:''};
  let chg=0,neu=0,rem=0;
  ['bonus','channel','penalty'].forEach(s=>{ const d=diffSection(s); d.rows.forEach(x=>{ if(x==='chg')chg++; if(x==='new')neu++; }); rem+=d.removed.length; });
  const parts=[]; if(chg)parts.push(`변경 ${chg}`); if(neu)parts.push(`신규 ${neu}`); if(rem)parts.push(`삭제 ${rem}`);
  return parts.length ? {label:`${state.data.prev.month} 대비 ${parts.join(' · ')}`, cls:'has'} : {label:`${state.data.prev.month}과 동일`, cls:''};
}

const won = n => (Number(n)||0).toLocaleString('ko-KR')+'원';
const OFF = '퇴/휴직';
const RANKS=/(사원|주임|대리|과장|차장|부장|팀장|실장|매니저|프로|인턴|님)$/;
const normName = n => String(n||'').replace(/\s+/g,'').replace(/\(.*?\)/g,'').replace(RANKS,'').replace(/\d+$/,'').trim();   // '이상민87' 같은 뒤 숫자 제거
function findEmp(name){ const k=normName(name); if(!k) return null; const hit=state.settings.employees.find(e=>normName(e.name)===k) || state.settings.employees.find(e=>normName(e.name).startsWith(k)||k.startsWith(normName(e.name))) || null;
  if(!hit && /^(퇴|휴)/.test(k) && k.length>=3) return findEmp(k.slice(1));      // '퇴홍길동' 처럼 퇴사 표시가 붙은 이름
  return hit; }
const empLabel = e => e.name + (e.rank?' '+e.rank:'');
const region = t => String(t||'').replace(/\s*\d*\s*팀$/,'').trim();          // '시흥1팀'→'시흥', '천안팀'→'천안'
const offBucket = t => { const r=region(t); return r ? r+' '+OFF : OFF; };      // '시흥 퇴/휴직'
const empBucket = e => (!e || e.status==='재직') ? (e?.team||'') : offBucket(e.team);
function teamOrder(){
  const regs=[]; state.settings.teams.forEach(t=>{ const r=region(t); if(r&&!regs.includes(r)) regs.push(r); });
  return state.settings.teams.concat(regs.map(r=>r+' '+OFF));
}
function sumKeys(sums){ const base=teamOrder(); return base.concat(Object.keys(sums).filter(k=>!base.includes(k)&&sums[k])); }

function penSummary(rows){

  rows.forEach(r=>{ const a=Number(r.amount)||0; const t=r.team||OFF; sums[t]=(sums[t]||0)+a; total+=a; });

/* 엑셀 파싱 → 집계 */
function parseWiselyWorkbook(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const H=aoa[0].map(h=>String(h||'').trim()); const col=n=>H.indexOf(n);
  const need=['고객명','상품명','상품옵션','속성','개통상태','토스자','가입서비스','접수일','개통일'];
  const miss=need.filter(n=>col(n)<0); if(miss.length) throw new Error('엑셀에 필요한 열이 없습니다: '+miss.join(', '));
  const g=(r,n)=>String(r[col(n)]==null?'':r[col(n)]).trim();
  const dt=(r,n)=>{ const v=r[col(n)]; if(v==null||v==='') return ''; if(v instanceof Date) return v.toISOString().slice(0,10);
    if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:''; }
    const m=String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:String(v).slice(0,10); };
  const details=[], wired={}, mobile={}, seen={};
  aoa.slice(2).forEach(r=>{
    if(!/^\d+$/.test(String(r[0]||'').trim())) return;
    const d={customer:g(r,'고객명'),product:g(r,'상품명'),option:g(r,'상품옵션'),recv:dt(r,'접수일'),open:dt(r,'개통일'),emp:g(r,'토스자')};
    const attr=g(r,'속성'), status=g(r,'개통상태'), svc=g(r,'가입서비스');
    const isNet=/인터넷/.test(d.product);                    // 스카이라이프 인터넷도 유선으로 집계
    const isMob=/^모바일/.test(d.product);
    if(!isNet && !isMob){ return; }                       // TV·부가·추가지급 등은 상세에도 넣지 않음
    d.kind=isNet?'유선':'무선';
    if(status!=='개통완료'){ d.verdict='제외: '+(status||'미개통'); details.push(d); return; }
    if(isNet){                                              // 인터넷 행은 회선마다 1건 (TV·OSS는 애초에 제외)
      d.verdict='집계'; wired[d.emp||'(미지정)']=(wired[d.emp||'(미지정)']||0)+1;
    } else {
      if(!/동판/.test(d.option)){ d.verdict='제외: 동판메인 아님'; details.push(d); return; }
      if(/가족|기기|스카이/.test(d.option+attr)){ d.verdict='제외: 가족/기기/스카이'; details.push(d); return; }
      d.verdict='집계'; mobile[d.emp||'(미지정)']=(mobile[d.emp||'(미지정)']||0)+1;
    }
    details.push(d);
  });
  const names=[...new Set([...Object.keys(wired),...Object.keys(mobile)])];
  const P=state.wz.prices||{wired:50000,mobile:100000};
  const rows=names.map(n=>({team:wzTeamOf(n),emp:n,wired:wired[n]||0,mobile:mobile[n]||0,wPrice:P.wired,mPrice:P.mobile,note:''}));
  // 팀 순서 → 이름순
  const order=teamOrder(); rows.sort((a,b)=>{ const ta=order.indexOf(a.team), tb=order.indexOf(b.team); if(ta!==tb) return (ta<0?99:ta)-(tb<0?99:tb); return a.emp.localeCompare(b.emp,'ko'); });
  // 검산: 유선/무선 시트가 있으면 건수 비교
  const chk={}; ['유선','무선'].forEach(nm=>{ const w=wb.Sheets[nm]; if(!w) return; const a=XLSX.utils.sheet_to_json(w,{header:1,raw:false,defval:''}); chk[nm]=a.slice(2).filter(r=>/^\d+$/.test(String(r[0]||'').trim())).length; });
  return {rows,details,chk};
}
async function wzFile(file){
  if(!file) return; if(!(await lockGuard(state.wz.month,ADJ_REGIONS,'upload'))) return;
  if(typeof XLSX==='undefined'){ toast('엑셀 라이브러리 로딩 중입니다. 잠시 후 다시 시도하세요.', true); return; }
  try{
    const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const {rows,details,chk}=parseWiselyWorkbook(wb);
    if(!state.edit) setEdit(true);
    state.wz.rows=rows; state.wz.details=details; state.wzDetailOpen=false;
    renderWisely();
    const tw=rows.reduce((a,r)=>a+r.wired,0), tm=rows.reduce((a,r)=>a+r.mobile,0);

    if(chk['유선']!=null||chk['무선']!=null){ const ok=(chk['유선']==null||chk['유선']===tw)&&(chk['무선']==null||chk['무선']===tm); msg+= ok?' (엑셀 유선/무선 시트와 일치)':` — 엑셀 시트 기준 유선 ${chk['유선']??'-'}·무선 ${chk['무선']??'-'} 와 차이 있음, 상세 확인`; if(!ok){ toast(msg,true); return; } }
    toast(msg);
  }catch(e){ toast('엑셀 읽기 실패: '+e.message, true); }
}

function parseSkyWorkbook(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const H=aoa[0].map(h=>String(h||'').trim()); const col=n=>H.indexOf(n);
  const miss=['고객명','상품명','개통상태','정산금액'].filter(n=>col(n)<0); if(miss.length) throw new Error('엑셀에 필요한 열이 없습니다: '+miss.join(', '));
  const g=(r,n)=>col(n)<0?'':String(r[col(n)]==null?'':r[col(n)]).trim();
  const dt=(r,n)=>{ if(col(n)<0) return ''; const v=r[col(n)]; if(v==null||v==='') return ''; if(v instanceof Date) return v.toISOString().slice(0,10); if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:''; } const m=String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:String(v).slice(0,10); };
  const details=[];
  aoa.slice(2).forEach(r=>{
    if(!/^\d+$/.test(String(r[0]||'').trim())) return;
    details.push({customer:g(r,'고객명'),product:g(r,'상품명'),option:g(r,'상품옵션'),open:dt(r,'개통일'),status:g(r,'개통상태'),kind:g(r,'정산종류')||'일반',amount:Number(String(r[col('정산금액')]||'0').replace(/,/g,''))||0,emp:g(r,'유치자')});
  });
  // 검산: 시트 하단 합계 셀(정산금액 열의 마지막 숫자)
  let sheetTotal=null; for(let i=aoa.length-1;i>=2;i--){ const v=aoa[i][col('정산금액')]; if(v!==''&&v!=null&&!/^\d+$/.test(String(aoa[i][0]||'').trim())){ sheetTotal=Number(String(v).replace(/,/g,''))||null; break; } }
  return {details, sheetTotal};
}

const teamsOfRegion = r => state.settings.teams.filter(t=>region(t)===r);

    else U.rows.push({region:r,team:c.teams[0]||ts[0]||r,ratio:100,count:n,amount:total,mode:'single',note:''});
  });

function parseUpWorkbook(wb){
  const details=[]; const sums={};
  wb.SheetNames.forEach(nm=>{
    const ws=wb.Sheets[nm]; const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}); if(!aoa.length) return;
    const H=aoa[0].map(h=>String(h||'').trim()); const col=n=>H.indexOf(n);
    if(col('고객명')<0||col('정산금액')<0||col('개통상태')<0) return;              // 요약 시트 등은 건너뜀
    const g=(r,n)=>col(n)<0?'':String(r[col(n)]==null?'':r[col(n)]).trim();
    const dt=(r,n)=>{ if(col(n)<0) return ''; const v=r[col(n)]; if(v==null||v==='') return ''; if(v instanceof Date) return v.toISOString().slice(0,10); if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:''; } const m=String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:String(v).slice(0,10); };
    const num=v=>Number(String(v==null?'':v).replace(/,/g,''))||0;
    aoa.slice(2).forEach(r=>{
      if(!/^\d+$/.test(String(r[0]||'').trim())) return;
      const d={customer:g(r,'고객명'),option:g(r,'상품옵션'),open:dt(r,'개통일'),status:g(r,'개통상태'),emp:g(r,'유치자'),fee:num(r[col('약정금액')]),amount:num(r[col('정산금액')]),coop:g(r,'협력점')};
      d.region=upRegionOf(d.coop,d.emp); details.push(d);
    });
    // 시트 하단 합계(검산)
    for(let i=aoa.length-1;i>=2;i--){ const v=aoa[i][col('정산금액')]; if(v!==''&&v!=null&&!/^\d+$/.test(String(aoa[i][0]||'').trim())){ sums[nm]=num(v); break; } }
  });
  return {details,sums};
}

/* ══════════ 매출보정 (뽐뿌 + 전체경로 통합) ══════════ */
const ADJ = {
  title:'매출보정', target:40000,
  rules:{ '뽐뿌':{below:40000, min:-Infinity}, '전체경로':{below:40000, min:-50000} },
  desc:{ '뽐뿌':'접수경로에 "뽐"이 있는 건 (뽐뿌일반 · 뽐쿠폰) — 합산 4만원 미만이면 4만원까지 보정',
         '전체경로':'그 외 모든 접수경로 — 합산 4만원 미만 ~ −5만원이면 4만원까지 보정 · −50,001원 이하는 자동 제외' },
};

// 엑셀 → 고객별 합산 → 규칙 판정
const ADJ_EXCL = /업셀링|전환|추가지급/;                     // 항상 제외 (0원 부속행 / 추가지급 행)
const ADJ_EXCL0 = /부가상품|인터넷전화|OSS/i;                  // 0원일 때만 제외 (부속 상품)
function parseAdjWorkbook(wb){
  let H=null, aoa=null;
  for(const nm of wb.SheetNames){ const a=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:''}); if(!a.length) continue; const h=a[0].map(x=>String(x||'').trim()); if(h.includes('고객명')&&h.includes('정산금액')&&h.includes('정산종류')){ H=h; aoa=a; break; } }
  if(!H) throw new Error('정산리스트 시트를 찾지 못했습니다 (고객명·정산종류·정산금액 열 필요)');
  const col=n=>H.indexOf(n); const g=(r,n)=>col(n)<0?'':String(r[col(n)]==null?'':r[col(n)]).trim();
  const num=v=>Number(String(v==null?'':v).replace(/,/g,''))||0;
  const rows=aoa.slice(1).filter(r=>/^\d+$/.test(String(r[0]||'').trim()));
  const total=rows.length;
  const base=rows.filter(r=>g(r,'정산종류')==='일반' && g(r,'개통상태')==='개통완료');
  const groups={};
  base.forEach(r=>{
    const customer=g(r,'고객명'), phone=g(r,'명의자연락처'); const key=normName(customer)+'|'+phone.replace(/\D/g,'');
    const product=g(r,'상품명'), amount=num(r[col('정산금액')]);
    const G=groups[key]=groups[key]||{customer,phone,emp:g(r,'유치자'),ppom:false,lines:[]};
    if(/뽐/.test(g(r,'접수경로'))) G.ppom=true;
    if(ADJ_EXCL.test(product)) return;
    if(amount===0 && ADJ_EXCL0.test(product)) return;
    G.lines.push({product,amount});
  });
  const out=[];
  Object.values(groups).forEach(G=>{
    if(!G.lines.length) return;
    const sum=G.lines.reduce((a,l)=>a+l.amount,0);
    const rule=G.ppom?'뽐뿌':'전체경로', cfg=ADJ.rules[rule];
    if(sum>=cfg.below) return;
    const note=G.lines.map(l=>`${l.product} ${l.amount.toLocaleString('ko-KR')}`).join(' / ');
    const row={emp:G.emp,customer:G.customer,phone:G.phone,rule,n:G.lines.length,amount:sum,need:ADJ.target-sum,adj:0,status:'대상',reason:'',note};
    if(sum<cfg.min){ row.status='제외'; row.adj=0; }
    else row.adj=row.need;
    out.push(row);
  });
  out.sort((a,b)=>a.emp.localeCompare(b.emp,'ko')||a.customer.localeCompare(b.customer,'ko'));
  return {rows:out, total};
}

  const rows=aoa.slice(1).filter(r=>/^\d+$/.test(String(r[0]||'').trim()));
  const total=rows.length;
  const base=rows.filter(r=>g(r,'정산종류')==='일반' && g(r,'개통상태')==='개통완료');
  const out=[];
  // 1) 비광고채널: 아웃(콜) + 인터넷 상품 → 인터넷 회선당 1건 (TV·부가는 미포함, 인터넷전화 제외)
  base.filter(r=>/아웃/.test(g(r,'접수경로')) && /인터넷/.test(g(r,'상품명')) && !/인터넷전화/.test(g(r,'상품명'))).forEach(r=>{

  });
  // 2) 가족동판: 모바일 + 옵션 '가족동판' + 가입서비스 '(기기)' 제외 + 동판수수료 있는 건만(속성 '수수료X' 제외, 동판수수료 0원 제외) → 회선당 1건
  const num=v=>Number(String(v==null?'':v).replace(/,/g,''))||0;
  base.filter(r=>/^모바일/.test(g(r,'상품명')) && /가족동판/.test(g(r,'상품옵션')) && !/\(기기\)/.test(g(r,'가입서비스')) && !/수수료\s*X/i.test(g(r,'속성')) && num(r[col('동판수수료')])!==0).forEach(r=>{
    out.push({kind:'가족동판',emp:g(r,'유치자'),customer:g(r,'고객명'),phone:g(r,'명의자연락처'),product:g(r,'상품명'),option:g(r,'상품옵션'),route:g(r,'접수경로'),open:dt(r,'개통일'),price:prices['가족동판'],status:'대상',reason:'',note:g(r,'가입서비스')});
  });
  out.sort((a,b)=>a.emp.localeCompare(b.emp,'ko')||a.kind.localeCompare(b.kind,'ko')||a.customer.localeCompare(b.customer,'ko'));

}

// regions: 검사할 지역 배열 (단일 업로드 메뉴는 ADJ_REGIONS 전부 → 둘 다 완료일 때 잠금). action: 'upload' | 'save'
async function lockGuard(month, regions, action){
  const L=await getLocks(month); const locked=regions.filter(r=>L[r]); if(!locked.length || locked.length<regions.length) return true;
  const who=locked.join('·');
  if(action==='upload'){ return (await dlg({title:'확인완료된 월입니다', desc:`${month} ${who}은(는) 개별 정산서에서 확인완료 처리된 상태입니다.\n그래도 업로드하시겠습니까?`, ok:'업로드', danger:true})).ok; }
  const a=await dlg({title:'확인완료된 월입니다', desc:`${month} ${who}은(는) 확인완료 상태입니다. 저장하면 이 월 데이터가 덮어써집니다.\n계속할까요?`, ok:'계속', danger:true}); if(!a.ok) return false;
  const b=await dlg({title:'정말 저장할까요?', desc:'저장하면 기존 데이터는 복구할 수 없습니다.\n마무리된 달은 다음 달에 보정 처리하는 것을 권장합니다.', ok:'저장 (복구 불가)', danger:true}); return b.ok;
}
/* ══════════ 개별 정산서 ══════════ */
const IND_RATE = 40, IND_THRESHOLD = 17000000, IND_BONUS = 2000000;
const IND_COLS = ['No','정산종류','고객명','속성','명의자연락처','가입서비스','상품명','상품옵션','회선수','셋트유형','협력점','유치자','접수일','개통일','개통상태','접수경로','사은품','상부정산','약정금액','차감내역-사은품','차감내역-물류','차감내역-쿠폰','차감내역-선납','차감내역-할인탭','차감내역-미비서류','차감내역-기타','수납','번들수수료','동판수수료','정산금액','정산 비고'];
const IND_DED = ['차감내역-사은품','차감내역-물류','차감내역-쿠폰','차감내역-선납','차감내역-할인탭','차감내역-미비서류','차감내역-기타'];
async function loadIndiv(month){
  try{
    let d=state.indCache[month];
    if(!d){ d=await api('getIndiv', month); state.indCache[month]=d; }
    d.regions=d.regions||{}; ADJ_REGIONS.forEach(r=>{ d.regions[r]=d.regions[r]||{rows:[],summary:null,updatedAt:'',updatedBy:''}; });
    ADJ_REGIONS.forEach(r=>indParseManual(d.regions[r].rows));
    state.ind=clone(d); state.indSaved=clone(d); state.indMonths=d.months||state.indMonths||[]; state.viewMonth=month; state.year=+month.slice(0,4);
    if(!ADJ_REGIONS.includes(state.indRegion)) state.indRegion=ADJ_REGIONS[0];
    state.indDetails={}; state.indDetailOpen=false;
    setEdit(false); renderIndiv(); renderPicker();
  }catch(e){ toast(e.message, true); }
}
function indRegionPick(r){ if(state.edit && isDirty() && state.indRegion!==r){ toast('편집 중인 지역을 먼저 저장하거나 취소하세요.', true); return; } state.indRegion=r; state.indEmp=null; state.indDetailOpen=false; renderIndiv(); }
function indEmpPick(k){ state.indEmp=k; state.indDetailOpen=false; renderIndiv(); }
const indKey = n => { let k=normName(n); if(/^(퇴|휴)/.test(k)&&k.length>=3) k=k.slice(1); return k; };
function parseIndivWorkbook(wb){
  let H=null, aoa=null;
  for(const nm of wb.SheetNames){ const a=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:''}); if(!a.length) continue; const h=a[0].map(x=>String(x||'').trim()); if(h.includes('유치자')&&h.includes('정산종류')&&h.includes('약정금액')){ H=h; aoa=a; break; } }
  if(!H) throw new Error('정산리스트 시트를 찾지 못했습니다 (유치자·정산종류·약정금액 열 필요)');
  const col=n=>H.indexOf(n); const g=(r,n)=>col(n)<0?'':String(r[col(n)]==null?'':r[col(n)]).trim();
  const num=(r,n)=>col(n)<0?0:(Number(String(r[col(n)]==null?'':r[col(n)]).replace(/,/g,''))||0);
  const dt=(r,n)=>{ if(col(n)<0) return ''; const v=r[col(n)]; if(v==null||v==='') return ''; if(v instanceof Date) return v.toISOString().slice(0,10); if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:''; } const m=String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:String(v).slice(0,10); };
  const DED=IND_DED;
  const rows=aoa.slice(1).filter(r=>/^\d+$/.test(String(r[0]||'').trim()));
  const byEmp={}, details=[];
  const cell=(r,n)=>{ const i=col(n); if(i<0) return ''; const v=r[i]; if(v==null||v==='') return ''; if(v instanceof Date) return v.toISOString().slice(0,10); if(/일$/.test(n)&&typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:v; } return typeof v==='number'?v:String(v).trim(); };
  rows.forEach(r=>{
    const emp=g(r,'유치자')||'(미지정)', kind=g(r,'정산종류');
    const d={}; IND_COLS.forEach(k=>d[k]=cell(r,k)); details.push(d);
    const fee=num(r,'약정금액'), recv=num(r,'수납'), bundle=num(r,'번들수수료'), dong=num(r,'동판수수료'), ded=DED.reduce((a,k)=>a+num(r,k),0), amount=num(r,'정산금액');
    const E=byEmp[emp]=byEmp[emp]||{emp,fee:0,cost:0,extra:0,refund:0,toss:0,n:0,nIlban:0,note:''};
    E.n++;
    if(kind==='일반'||kind==='추가'){ E.nIlban++; E.fee+=fee+recv+dong+bundle; E.cost+=ded; }
    else if(kind==='환수'){ E.refund+=-amount; }
  });
  const out=Object.values(byEmp).sort((a,b)=>a.emp.localeCompare(b.emp,'ko'));
  return {rows:out, details, total:rows.length};
}
async function indFile(file){
  if(!file) return; if(!(await lockGuard(state.ind.month,[state.indRegion],'upload'))) return;
  if(typeof XLSX==='undefined'){ toast('엑셀 라이브러리 로딩 중입니다. 잠시 후 다시 시도하세요.', true); return; }
  const reg=state.indRegion, R=state.ind.regions[reg];
  try{
    const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const {rows,details,total}=parseIndivWorkbook(wb);
    if(!state.edit) setEdit(true);
    // 기존 토스비 유지
    const prevToss={}, prevMan={}; (R.rows||[]).forEach(r=>{ prevToss[indKey(r.emp)]=r.toss; prevMan[indKey(r.emp)]=r.manual; });
    rows.forEach(r=>{ if(prevToss[indKey(r.emp)]) r.toss=prevToss[indKey(r.emp)]; r.manual=prevMan[indKey(r.emp)]||{}; });
    R.rows=rows; R.summary={...(R.summary||{}),total,file:file.name,rate:(R.summary&&R.summary.rate)||IND_RATE,extras:indExtras(R)}; R.pendingDetails=details;
    state.indDetails={}; details.forEach(d=>{ const k=reg+'|'+indKey(d['유치자']); (state.indDetails[k]=state.indDetails[k]||[]).push(d); });
    state.indEmp=null; renderIndiv();
    toast(`${reg} ${total}행 읽음 → 유치자 ${rows.length}명`);
  }catch(e){ toast('엑셀 읽기 실패: '+e.message, true); }
}
// 수기 항목: R.summary.extras = [{name, sign(+1 가산/-1 차감)}], 사람별 값은 r.manual = {name: amount} (시트 '비고'에 JSON 저장)
const indExtras = R => (R&&R.summary&&Array.isArray(R.summary.extras)) ? R.summary.extras : [];
const indManual = (r, name) => Number((r.manual||{})[name])||0;
function indParseManual(rows){ (rows||[]).forEach(r=>{ if(r.manual) return; try{ r.manual = r.note && r.note[0]==='{' ? JSON.parse(r.note) : {}; }catch(e){ r.manual={}; } }); }
function indExtraAdd(){ const R=state.ind.regions[state.indRegion]; R.summary=R.summary||{}; R.summary.extras=indExtras(R).concat([{name:'', sign:1}]); renderIndiv(); const els=$('icol1').querySelectorAll('input[data-xn]'); els[els.length-1]?.focus(); }
function indExtraDel(i){ const R=state.ind.regions[state.indRegion]; const ex=indExtras(R).slice(); const nm=ex[i]&&ex[i].name; ex.splice(i,1); R.summary.extras=ex; if(nm) R.rows.forEach(r=>{ if(r.manual) delete r.manual[nm]; }); renderIndiv(); }
function indExtraName(i,v){ const R=state.ind.regions[state.indRegion]; const ex=indExtras(R); const old=ex[i].name; ex[i].name=String(v).trim(); if(old&&old!==ex[i].name) R.rows.forEach(r=>{ if(r.manual&&old in r.manual){ r.manual[ex[i].name]=r.manual[old]; delete r.manual[old]; } }); renderIndiv(); }
function indExtraSign(i,v){ const R=state.ind.regions[state.indRegion]; indExtras(R)[i].sign=Number(v)||1; renderIndiv(); }
function indManualSet(name,v){ const R=state.ind.regions[state.indRegion]; const r=R.rows.find(x=>indKey(x.emp)===state.indEmp); if(!r) return; r.manual=r.manual||{}; r.manual[name]=Number(String(v).replace(/[^\d-]/g,''))||0; renderIndiv(); }
function indCalc(r, R){
  const L=state.ind.lookups||{bonus1:{},bonus2:{},wisely:{},refundAdj:{}}, k=indKey(r.emp);
  const b1=L.bonus1[k]||{n:0,amount:0,kinds:{}}, b2=L.bonus2[k]||{n:0,amount:0}, wz=L.wisely[k]||{wired:0,mobile:0,wiredAmt:0,mobileAmt:0}, rfa=(L.refundAdj||{})[k]||{n:0,amount:0};
  const rate=(R.summary&&R.summary.rate)||IND_RATE;
  const base=r.fee-r.cost+b1.amount+b2.amount+wz.wiredAmt+wz.mobileAmt+rfa.amount;      // 환수완료 개별 보정 포함 · 파일의 '추가' 행은 미반영
  const cond=base>IND_THRESHOLD?IND_BONUS:0;
  const extras=indExtras(R).filter(x=>x.name); const manual=extras.reduce((a,x)=>a+(x.sign<0?-1:1)*indManual(r,x.name),0);
  const total=base+cond+(Number(r.toss)||0)+manual-r.refund;
  return {b1,b2,wz,rfa,rate,base,cond,total,final:Math.round(total*rate/100),extras,manual};
}
function indEmpInfo(name){ const e=findEmp(name); return { e, label: e?empLabel(e):name, team: e?(e.team||''):'', rank: e?(e.rank||''):'', off: e&&e.status!=='재직'?e.status:'' }; }

  $('dh_title').textContent=`${A.month} 개별 정산서`;

  const rate=(R.summary&&R.summary.rate)||IND_RATE;
  // 정렬: 팀 순서 → 이름
  const order=teamOrder(); const sorted=rows.map(r=>({r,i:indEmpInfo(r.emp)})).sort((a,b)=>{ const ta=order.indexOf(a.i.team), tb=order.indexOf(b.i.team); return (ta<0?99:ta)-(tb<0?99:tb) || a.i.label.localeCompare(b.i.label,'ko'); });
  if(!state.indEmp && sorted.length) state.indEmp=indKey(sorted[0].r.emp);
  const cur=rows.find(r=>indKey(r.emp)===state.indEmp);
  // 왼쪽

  if(R.summary){ const cf=!!R.summary.confirmed, pb=!!R.summary.published;
    l+=`<div class="pub ${cf?'lock':(pb?'on':'')}">`+(ed
      ? `<label class="chk"><input type="checkbox" ${pb?'checked':''} onchange="indPublish(this.checked)"><b>사원에게 공개</b> <span class="sub">— 체크한 달만 사원·팀장 계정에서 조회 가능 (팀별 정산서·추가매출1·2도 같이 공개)</span></label>`
      : `<div class="pubrow"><b>${cf?'🔒 확인완료':(pb?'✓ 사원 공개 중':'사원 비공개')}</b>${state.editor?`<span class="pubbtns"><button class="editbtn" onclick="indFlag('published',${pb?'false':'true'})">${pb?'공개 끄기':'공개 켜기'}</button><button class="editbtn ${cf?'':'pri'}" onclick="indConfirm(${cf?'false':'true'})">${cf?'확인완료 해제':'확인완료'}</button></span>`:''}</div><div class="sub">${cf?'이 지역·월은 마무리됨 — 편집 불가, 다른 메뉴 업로드 시 경고':(pb?'사원은 본인 정산서·추가매출, 팀장은 팀 전체·팀별 정산서·추가매출을 볼 수 있습니다':'공개 켜기를 누르면 사원·팀장이 볼 수 있습니다')}</div>`)+`</div>`; }
  if(ed||!R.summary) l+=`<div class="upl" id="indDrop" ${state.editor?'':'style="display:none"'}><b>${reg}</b> 정산리스트 엑셀 <label style="cursor:pointer"><b><u>파일 선택</u></b><input type="file" accept=".xlsx,.xls" style="display:none" onchange="indFile(this.files[0]);this.value=''"></label><div class="sub" style="margin-top:4px">추가매출·와이즐리와 같은 파일${R.summary?' · 다시 올리면 덮어씀':''}</div></div>`;

      +`<div class="il tot"><span>합계 ${rows.length}명</span><span class="amt">${rows.reduce((a,r)=>a+indCalc(r,R).final,0).toLocaleString('ko-KR')}</span></div>`; }
  l+=`</div>`;
  const exs=indExtras(R);
  l+=`<div class="block">${secHead('Manual items','수기 항목',exs.length)}`+(ed
    ? exs.map((x,i)=>`<div class="xrow"><input data-xn value="${esc(x.name)}" placeholder="항목명 (예: 직급수당)" onchange="indExtraName(${i},this.value)"><select onchange="indExtraSign(${i},this.value)"><option value="1" ${x.sign>=0?'selected':''}>가산 (+)</option><option value="-1" ${x.sign<0?'selected':''}>차감 (−)</option></select><button class="editbtn danger" onclick="indExtraDel(${i})">✕</button></div>`).join('')+`<div class="addrow"><button class="editbtn" onclick="indExtraAdd()">+ 항목 추가</button></div><div class="sub" style="padding-top:6px">토스비처럼 사람별로 금액을 수기 입력하는 항목. 정산서 카드·팀별 정산서·엑셀에 자동으로 열이 생깁니다 (1,700만 판정에는 미포함).</div>`

  l+=`<div class="block">${secHead('Rules','산출 기준')}<div class="rules"><ul><li>수수료 = 일반·추가 행의 약정금액+수납+동판수수료+번들수수료</li><li>비용 = 일반·추가 행의 차감내역 합</li><li>추가매출1·2·와이즐리는 각 메뉴에서 자동 반영</li><li>수수료 − 비용 + 추가매출1·2 + 와이즐리 + 환수완료 보정 &gt; 1,700만 → 추가매출3 200만</li><li>환수완료 보정 = 환수완료 메뉴의 '개별' 구분 건 입금액 (유치자별)</li><li>파일의 정산종류 '추가' 행은 반영하지 않음 (환수 행만 환수차감)</li><li>인센티브합 = 위 합계 + 추가매출3 + 토스비 ± 수기 항목 − 환수차감</li><li>예상인센티브 = 인센티브합 × ${ed?`<input class="num" type="number" style="width:56px;height:24px;padding:2px 6px" value="${rate}" onchange="indRate(this.value)">`:rate}%</li></ul></div></div>`;
  $('icol1').innerHTML=l;

  let h='';
  if(!cur){ h=`<div class="empty-row">${R.summary?'왼쪽에서 유치자를 선택하세요.':'엑셀을 업로드하면 정산서가 계산됩니다.'}</div>`; }
  else h=indCardHtml(cur,R,ed)+indDetailHtml(cur,reg);

async function indFlag(key,val){ const R=state.ind.regions[state.indRegion]; if(!R.summary) return;
  try{ const d=await api('setIndivFlags', state.ind.month, state.indRegion, {[key]:val}); ADJ_REGIONS.forEach(r=>{ d.regions[r]=d.regions[r]||{rows:[],summary:null,updatedAt:'',updatedBy:''}; indParseManual(d.regions[r].rows); });

function parseOccurWorkbook(wb){
  const out=[]; const cats=[];
  const sheets=wb.SheetNames.filter(n=>n.trim()!=='전체'); const use=sheets.length?sheets:wb.SheetNames;
  use.forEach(nm=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:''}); if(!aoa.length) return;
    const H=aoa[0].map(h=>String(h||'').trim()); const col=n=>H.indexOf(n); if(col('고객명')<0||col('정산금액')<0||col('유치자')<0) return;
    const g=(r,n)=>col(n)<0?'':String(r[col(n)]==null?'':r[col(n)]).trim();
    const num=v=>Number(String(v==null?'':v).replace(/,/g,''))||0;
    const dt=(r,n)=>{ if(col(n)<0) return ''; const v=r[col(n)]; if(v==null||v==='') return ''; if(v instanceof Date) return v.toISOString().slice(0,10); if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:''; } const m=String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:String(v).slice(0,10); };
    const cat=nm.trim(); let n=0;
    aoa.slice(1).forEach(r=>{ if(!/^\d+$/.test(String(r[0]||'').trim())) return; n++;
      out.push({cat,emp:g(r,'유치자'),customer:g(r,'고객명'),product:g(r,'상품명'),option:g(r,'상품옵션'),open:dt(r,'개통일'),status:g(r,'개통상태'),memo:g(r,'정산 비고'),amount:num(r[col('정산금액')])}); });
    cats.push(cat);
  });
  if(!out.length) throw new Error('환수 행을 찾지 못했습니다 (유치자·고객명·정산금액 열 필요)');
  return {rows:out, cats, total:out.length};
}

/* ══════════ 팀손익 결산 (전사 결산데이터 업로드 → 팀별 손익 · 정산관리 대조) ══════════ */
const CL_TOL = 0;                                    // 허용 오차(원): 0 = 1원 차이도 오류

/* 파일 파싱: 개별정산서와 같은 어드민 정산리스트 (전사) → 협력점별 · 협력점×유치자별 집계 */
function parseCloseWorkbook(wb){
  let H=null, aoa=null;
  for(const nm of wb.SheetNames){ const a=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:''}); if(!a.length) continue; const h=a[0].map(x=>String(x||'').trim()); if(h.includes('협력점')&&h.includes('유치자')&&h.includes('정산종류')&&h.includes('약정금액')){ H=h; aoa=a; break; } }
  if(!H) throw new Error('결산데이터 시트를 찾지 못했습니다 (협력점·유치자·정산종류·약정금액 열 필요)');
  const col=n=>H.indexOf(n);
  const g=(r,n)=>col(n)<0?'':String(r[col(n)]==null?'':r[col(n)]).trim();
  const num=(r,n)=>col(n)<0?0:(Number(String(r[col(n)]==null?'':r[col(n)]).replace(/,/g,''))||0);
  const year=(r,n)=>{ if(col(n)<0) return 0; const v=r[col(n)]; if(v==null||v==='') return 0; if(v instanceof Date) return v.getFullYear(); if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?d.y:0; } const m=String(v).match(/(\d{4})-\d{2}/); return m?+m[1]:0; };
  const rows=aoa.slice(1).filter(r=>/^\d+$/.test(String(r[0]||'').trim()));
  const cell=(r,n)=>{ const i=col(n); if(i<0) return ''; const v=r[i]; if(v==null||v==='') return ''; if(v instanceof Date) return v.toISOString().slice(0,10); if(/일$/.test(n)&&typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:v; } return typeof v==='number'?v:String(v).trim(); };
  const T={}, E={}, details=[]; let prevN=0, prevAmt=0, paidN=0, paidAmt=0;
  const mk=(coop,emp)=>({coop,emp:emp||'',fee:0,cost:0,refund:0,paid:0,n:0,nIlban:0});
  rows.forEach(r=>{
    const coop=g(r,'협력점')||'(협력점 없음)', emp=g(r,'유치자')||'(미지정)', kind=g(r,'정산종류');
    if(CL_REG(coop)){ const d={}; IND_COLS.forEach(k=>d[k]=cell(r,k)); d['협력점']=coop; details.push(d); }
    const fee=num(r,'약정금액'), recv=num(r,'수납'), bundle=num(r,'번들수수료'), dong=num(r,'동판수수료'), ded=IND_DED.reduce((a,k)=>a+num(r,k),0), amount=num(r,'정산금액');
    const t=T[coop]=T[coop]||mk(coop), ek=coop+'|'+emp, e=E[ek]=E[ek]||mk(coop,emp);
    t.n++; e.n++;
    if(kind==='일반'||kind==='추가'){ t.nIlban++; e.nIlban++; const f=fee+recv+dong+bundle; t.fee+=f; e.fee+=f; t.cost+=ded; e.cost+=ded; }
    else if(kind==='환수'){
      e.refund+=-amount;                                   // 개별정산서와 같은 정의 (입금 포함, +=차감)
      if(amount<0) t.refund+=amount; else if(amount>0){ t.paid+=amount; e.paid+=amount; paidN++; paidAmt+=amount; }
      const oy=year(r,'개통일'); if(oy&&oy<+state.cl.month.slice(0,4)){ prevN++; prevAmt+=amount; }
    }
  });
  const teams=Object.values(T).sort((a,b)=>CL_ORD(a.coop)-CL_ORD(b.coop)||a.coop.localeCompare(b.coop,'ko'));
  const emps=Object.values(E).sort((a,b)=>CL_ORD(a.coop)-CL_ORD(b.coop)||a.coop.localeCompare(b.coop,'ko')||a.emp.localeCompare(b.emp,'ko'));
  return {teams, emps, details, total:rows.length, paid:{n:paidN,amount:paidAmt}, prev:{n:prevN,amount:prevAmt}};
}
async function clFile(file){
  if(!file) return; if(typeof XLSX==='undefined'){ toast('엑셀 라이브러리 로딩 중입니다. 잠시 후 다시 시도하세요.', true); return; }
  try{
    const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array',cellDates:true});

    state.cl.teams=teams; state.cl.emps=emps; state.cl.summary={...S,total,file:file.name,paid,prev,notes:S.notes||[],overrides:{}};   // 새 파일이면 수기 수정 초기화
    state.cl.pendingDetails=details; state.clDetMem={}; details.forEach(d=>{ const k=CL_REG(d['협력점'])+'|'+indKey(d['유치자']); (state.clDetMem[k]=state.clDetMem[k]||[]).push(d); }); state.clDet={}; state.clDetOpen={};

    toast(`${total}건 · ${teams.length}개 팀 읽음 → ${bad}`, ADJ_REGIONS.some(r=>v[r].status==='bad'));
  }catch(e){ toast('엑셀 읽기 실패: '+e.message, true); }
}
/* 표 계산: 파일값 + 정산관리 저장값 */
function clCalc(){
  const C=state.cl, m=C.month, S=C.summary||{};
  const wz=(C.wisely&&C.wisely.rows)||[], sky=C.sky||[], up=C.up||[], pen=C.penalty||[], rf=C.refund||[], oc=C.occur||{};
  const isMgmt=r=>RF_MGMT.test(r.collector);
  const rfLive=rf.filter(r=>!isMgmt(r)).map(r=>({...r,cat:r.cat||rfAutoCat(r,m)}));
  const retired=name=>{ const e=findEmp(name); return e ? e.status!=='재직' : /^(퇴|휴)/.test(String(name||'').trim()); };
  const rows=(C.teams||[]).map(t=>{
    const reg=CL_REG(t.coop), o={...t, reg, goal:0, bonus:0, toss:0, paidRf:0, sky:null, up:null, pen:null, y25occ:null, y25paid:null, y25:null, retiredOcc:0, retiredPaid:0};
    if(reg){
      const R=state.ind.regions[reg]||{rows:[]}; const calcs=(R.rows||[]).map(r=>indCalc(r,R)); o.goalN=calcs.filter(c=>c.cond>0).length; o.goal=o.goalN*IND_BONUS; o.indN=(R.rows||[]).length;
      o.bonus=calcs.reduce((a,c)=>a+c.b1.amount+c.b2.amount,0);   // 추가매출1(건당)+2(보정) — 개별정산서와 동일
      o.toss=wz.filter(r=>region(r.team)===reg).reduce((a,r)=>a+(Number(r.amount)||0),0);
      o.paidRf=rfLive.filter(r=>r.cat==='개별'&&!r.exAdj&&rfRegionOf(r.dept)===reg).reduce((a,r)=>a+r.paid,0);
      o.sky=sky.filter(r=>region(r.team)===reg).reduce((a,r)=>a+(Number(r.amount)||0),0);
      o.up=up.filter(r=>(r.region||region(r.team))===reg).reduce((a,r)=>a+(Number(r.amount)||0),0);
      o.pen=-pen.filter(r=>region(r.team)===reg||r.team===reg+' '+OFF).reduce((a,r)=>a+(Number(r.amount)||0),0);
      const occ=((oc[reg]||{}).rows||[]).filter(r=>/이전/.test(r.cat));
      o.retiredOcc=occ.filter(r=>retired(r.emp)).reduce((a,r)=>a+r.amount,0);
      o.y25occ=occ.filter(r=>!retired(r.emp)).reduce((a,r)=>a+r.amount,0);
      o.y25paid=rfLive.filter(r=>r.cat==='팀결산'&&!r.exAdj&&rfRegionOf(r.dept)===reg).reduce((a,r)=>a+r.paid,0);
      o.retiredPaid=rfLive.filter(r=>r.cat==='제외'&&rfRegionOf(r.dept)===reg).reduce((a,r)=>a+r.paid,0);
      o.y25=o.y25occ+o.y25paid;
    }
    // 수기 수정 (편집에서 셀 직접 입력) — 원래 값은 o.orig 에 보관
    const ov=(S.overrides||{})[t.coop]||{}; o.orig={}; o.ov=ov;
    Object.keys(ov).forEach(k=>{ if(ov[k]===''||ov[k]==null) return; o.orig[k]=o[k]; o[k]=Number(ov[k])||0; if(k==='cost') o[k]=-o[k]; });   // 비용은 화면 표기(음수) 기준으로 입력

  const auto=[]; rows.forEach(o=>{ if(o.retiredOcc) auto.push({label:`${o.reg} 팀결산제외_퇴직자 환수발생`, amount:o.retiredOcc, auto:true}); if(o.retiredPaid) auto.push({label:`${o.reg} 퇴직자 환수입금 (팀결산 제외)`, amount:o.retiredPaid, auto:true}); });

}
/* 정산관리 대조 (시흥·천안): 파일 유치자별 vs 개별정산서 저장값 */
function clVerify(){
  const C=state.cl, out={};
  ADJ_REGIONS.forEach(reg=>{
    const t=(C.teams||[]).find(x=>CL_REG(x.coop)===reg); const R=state.ind.regions[reg]||{rows:[],summary:null};
    const F={}; (C.emps||[]).filter(e=>t&&e.coop===t.coop).forEach(e=>{ F[indKey(e.emp)]=e; });
    const Sv={}; (R.rows||[]).forEach(r=>{ Sv[indKey(r.emp)]=r; });
    const keys=[...new Set(Object.keys(F).concat(Object.keys(Sv)))].sort((a,b)=>a.localeCompare(b,'ko'));
    const FIELDS=[['fee','수수료'],['cost','비용'],['refund','환수차감'],['n','전체건'],['nIlban','일반건']];
    const list=keys.map(k=>{ const f=F[k], s=Sv[k]; const d={}; let st='ok';
      FIELDS.forEach(([key])=>{ const a=f?Number(f[key])||0:null, b=s?Number(s[key])||0:null; const diff=(a==null||b==null)?null:a-b; d[key]={a,b,diff}; if(diff==null) st='bad'; else if(Math.abs(diff)>CL_TOL) st='bad'; else if(diff!==0&&st==='ok') st='warn'; });

    out[reg]={ reg, coop:t?t.coop:'', status, list, bad:list.filter(x=>x.status==='bad').length, warn:list.filter(x=>x.status==='warn').length, confirmed:!!(R.summary&&R.summary.confirmed), fields:FIELDS,
      tot: FIELDS.reduce((o,[key])=>{ const a=list.reduce((x,r)=>x+(r.d[key].a||0),0), b=list.reduce((x,r)=>x+(r.d[key].b||0),0); o[key]={a,b,diff:a-b}; return o; },{}) };
  });
  return out;
}

/* 유치자 고객별 상세 대조: 파일(팀손익결산_상세 또는 방금 올린 파일) vs 정산관리(개별정산_상세) */
const clNormCust = n => String(n||'').replace(/[*!?○●×xX＊ㅇ]/g,'*').replace(/\s+/g,'').trim();

function clDetMatch(file, saved){
  const pool={}; saved.forEach((d,i)=>{ const k=clDetKey(d); (pool[k]=pool[k]||[]).push(i); });
  const used={}; const out=[];
  file.forEach(f=>{ const k=clDetKey(f); const cand=(pool[k]||[]).filter(i=>!used[i]);
    // 같은 키가 여럿이면 정산금액이 같은 것을 우선
    let pick=cand.find(i=>clDetNum(saved[i],'정산금액')===clDetNum(f,'정산금액')); if(pick==null) pick=cand[0];
    if(pick==null){ out.push({f, s:null, st:'file'}); return; } used[pick]=true; const sd=saved[pick];
    const diff=CL_DET_F.some(([k])=>clDetNum(f,k)!==clDetNum(sd,k)); out.push({f, s:sd, st:diff?'bad':'ok'}); });

}
