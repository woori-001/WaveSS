  const st=s=>['재직','휴직','퇴직'].map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
  const shown = (!ed && state.teamFilter) ? emps.filter(e=>e.team===state.teamFilter) : emps;
  const eh=`<div class="block">${secHead('Employees','사원'+((!ed&&state.teamFilter)?` <span class="filt" onclick="teamPick('')">${esc(state.teamFilter)} ✕</span>`:''),shown.length)}<div class="se" style="padding:4px 4px 6px;border-bottom:1px solid var(--ink-l)"><span class="cap" style="letter-spacing:.08em;color:var(--tx3)">#</span><span class="cap" style="letter-spacing:.08em;color:var(--tx3)">이름</span><span class="cap" style="letter-spacing:.08em;color:var(--tx3)">직급</span><span class="cap" style="letter-spacing:.08em;color:var(--tx3)">팀</span><span class="cap" style="letter-spacing:.08em;color:var(--tx3)">상태</span><span class="cap" style="letter-spacing:.08em;color:var(--tx3)">이메일 (본인 조회용)</span><span></span></div>`+(ed
    ? emps.map((e,i)=>`<div class="se" data-i="${i}"><span class="no">${i+1}</span><input data-k="name" value="${esc(e.name)}" placeholder="이름"><input data-k="rank" value="${esc(e.rank||'')}" placeholder="직급"><select data-k="team">${opts(e.team)}</select><select data-k="status">${st(e.status)}</select><input data-k="email" value="${esc(e.email||'')}" placeholder="구글 계정">${opsHtml('e',i).replace(/moveRow\('e',/g,'empMove(').replace(/delRow\('e',/g,'empDel(')}</div>`).join('')+`<div class="addrow"><button class="editbtn" onclick="empAdd()">+ 사원 추가</button></div>`
    : (shown.length? shown.map((e,i)=>`<div class="se"><span class="no">${i+1}</span><b>${esc(e.name)}</b><span class="sub">${esc(e.rank||'')}</span><span>${e.team?`<span class="tag">${esc(e.team)}</span>`:''}</span><span class="st ${e.status!=='재직'?'off':''}">${esc(e.status)}</span><span class="sub" style="overflow:hidden;text-overflow:ellipsis">${esc(e.email||'')}</span><span></span></div>`).join('') : `<div class="empty-row">${state.teamFilter?'이 팀에 등록된 사원이 없습니다.':'등록된 사원이 없습니다. 편집에서 추가하세요.'}</div>`))+`</div>`;
  const adm=`<div class="block">${secHead('Admin','관리')}`+(ed
    ? `<div class="sl"><span class="no">앱</span><input data-k="appName" value="${esc(S.appName||'정산 관리')}" placeholder="앱 이름"></div><div class="sub" style="padding:8px 4px 4px">편집자 (쉼표로 구분 · 여기 등록된 계정만 관리자 화면 사용)</div><textarea data-k="editors" rows="4" style="width:100%">${esc((S.editors||'').split(',').map(x=>x.trim()).filter(Boolean).join(',\n'))}</textarea>`
    : `<div class="sl"><span class="no">앱</span><span>${esc(S.appName||'정산 관리')}</span></div><div class="sub" style="padding:8px 4px 2px">편집자</div>${(S.editors||'').split(',').map(x=>x.trim()).filter(Boolean).map((x,i)=>`<div class="sl"><span class="no">${i+1}</span><span style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em" title="${esc(x)}">${esc(x)}</span></div>`).join('')||'<div class="sub" style="padding:0 4px">(없음)</div>'}`)+`</div>`;
  $('scol1').innerHTML=th+adm; $('scol2').innerHTML=eh;
}
function teamPick(t){ state.teamFilter = (state.teamFilter===t) ? '' : t; renderSettings(); }
function syncSetDom(){
  if(!state.edit||!state.sset) return;
  document.querySelectorAll('#scol1 .sl[data-i]').forEach(el=>{ state.sset.teams[+el.dataset.i]=el.querySelector('[data-k=team]').value; });
  document.querySelectorAll('#scol2 .se[data-i]').forEach(el=>{ const e=state.sset.employees[+el.dataset.i]; if(!e) return; el.querySelectorAll('[data-k]').forEach(f=>e[f.dataset.k]=f.value); });
  const a=$('scol1').querySelector('[data-k=appName]'); if(a) state.sset.appName=a.value; const ed=$('scol1').querySelector('[data-k=editors]'); if(ed) state.sset.editors=ed.value;
}
function teamAdd(){ syncSetDom(); state.sset.teams.push(''); renderSettings(); }
function teamDel(i){ syncSetDom(); state.sset.teams.splice(i,1); renderSettings(); }
function teamMove(i,d){ syncSetDom(); const a=state.sset.teams; const j=i+d; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; renderSettings(); }
function empAdd(){ syncSetDom(); state.sset.employees.push({name:'',rank:'',team:state.sset.teams[0]||'',status:'재직',email:''}); renderSettings(); const els=document.querySelectorAll('#scol2 .se input'); els[els.length-1]?.focus(); }
function empDel(i){ syncSetDom(); state.sset.employees.splice(i,1); renderSettings(); }
function empMove(i,d){ syncSetDom(); const a=state.sset.employees; const j=i+d; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; renderSettings(); }
async function saveSettings(){
  syncSetDom();
  const teams=state.sset.teams.map(t=>t.trim()).filter(Boolean);
  const employees=state.sset.employees.filter(e=>e.name.trim()).map(e=>({name:e.name.trim(),rank:(e.rank||'').trim(),team:e.team,status:e.status||'재직',email:(e.email||'').trim().toLowerCase()}));
  try{ state.settings=await api('saveSettings',{teams,employees,editors:String(state.sset.editors||''),appName:String(state.sset.appName||'')}); fillEmpList(); state.sset=null; setEdit(false); renderSettings(); toast('저장했습니다.'); }
  catch(e){ toast('저장 실패: '+e.message, true); }
}

/* ────────── 이미지 보관 ────────── */
function renderImages(){
  const all=state.data?.images||[];
  const imgs = state.view==='penalty' ? all.filter(i=>/채증|패널티/.test(i.name)) : state.view==='wisely' ? all.filter(i=>/와이즐리/.test(i.name)) : state.view==='sky' ? all.filter(i=>/스카이/.test(i.name)) : state.view==='up' ? all.filter(i=>/업셀링/.test(i.name)) : state.view==='adj' ? all.filter(i=>/추가매출2|매출보정|뽐뿌|전체경로/.test(i.name)) : state.view==='bonus' ? all.filter(i=>/추가매출1|추가매출_/.test(i.name)) : state.view==='indiv' ? all.filter(i=>/_정산서_/.test(i.name)) : state.view==='team' ? all.filter(i=>/팀별정산서/.test(i.name)) : state.view==='appr' ? all.filter(i=>/전자결재/.test(i.name)) : state.view==='refund' ? all.filter(i=>/환수완료/.test(i.name)) : state.view==='occur' ? all.filter(i=>/환수발생/.test(i.name)) : all.filter(i=>!/채증|패널티|와이즐리|스카이|업셀링|매출보정|뽐뿌|전체경로|추가매출|정산서|전자결재|환수완료|환수발생/.test(i.name));
  $('btnImages').textContent=`보관 이미지 보기${imgs.length?` (${imgs.length})`:''}`;
  $('imgs').innerHTML = imgs.length ? imgs.map(im=>`<div class="img-card"><div class="nm">${esc(im.name)}</div><div class="sub">${esc(im.uploadedAt)} · ${esc(String(im.uploadedBy||'').split('@')[0])}</div>
    <div class="ops"><button class="btn sm" onclick="viewImage('${esc(im.id)}')">보기</button><a class="btn sm" href="${esc(im.url)}" target="_blank">새 창</a>${state.editor?`<button class="btn sm danger" onclick="delImage('${esc(im.id)}')">삭제</button>`:''}</div></div>`).join('') : '<div class="sub">보관된 이미지가 없습니다.</div>';
}
async function viewImage(id){ try{ $('viewerImg').src=await api('getImageData', id); $('viewer').style.display='flex'; }catch(e){ toast(e.message, true); } }
async function delImage(id){
  if(!(await dlg({title:'이미지 삭제', desc:'보관함에서 삭제합니다. (복구 불가)', ok:'삭제', danger:true})).ok) return;
  try{ state.data.images=await api('deleteImage', state.month, id); renderImages(); toast('삭제했습니다.'); }catch(e){ toast(e.message,true); }
}
async function uploadFiles(files){
  for(const f of files){
    if(f.size>8*1024*1024){ toast(f.name+': 8MB 이하만 업로드 가능', true); continue; }
    const b64=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result.split(',')[1]); fr.readAsDataURL(f); });
    try{ state.data.images=await api('uploadImage', state.month, f.name, f.type||'image/png', b64); renderImages(); toast(f.name+' 업로드'); }catch(e){ toast(e.message, true); }
  }
}
const drop=$('drop');
drop.addEventListener('dragover',e=>{e.preventDefault();drop.style.borderColor='var(--ink)';});
drop.addEventListener('dragleave',()=>drop.style.borderColor='');
drop.addEventListener('drop',e=>{e.preventDefault();drop.style.borderColor='';uploadFiles(e.dataTransfer.files);});

/* ────────── 로그인 (Supabase Auth) ────────── */
function showLogin(on){ $('login').style.display=on?'flex':'none'; document.body.classList.toggle('booting', on); }
async function logout(){ if(!(await dlg({title:'로그아웃', desc:'로그아웃할까요?', ok:'로그아웃'})).ok) return; try{ await sb.auth.signOut(); }catch(e){} location.reload(); }
$('userinfo').title='클릭하면 로그아웃'; $('userinfo').onclick=logout;
async function boot(){
  if(window.__mock){ init(); return; }
  if(!sb){ $('empty').innerHTML='<b style="color:var(--danger)">config.js 설정이 없습니다</b><br><span class="sub">docs/settle/config.js 에 Supabase URL과 anon key를 넣으세요.</span>'; showEmpty(true); return; }
  const { data: { session } } = await sb.auth.getSession();
  if(session){ showLogin(false); init(); }
  else showLogin(true);
  sb.auth.onAuthStateChange((ev, s)=>{ if(ev==='SIGNED_IN' && s && $('login').style.display!=='none'){ showLogin(false); init(); } if(ev==='SIGNED_OUT'){ location.reload(); } });
  $('btnGoogle').onclick=async()=>{ $('lerr').textContent=''; const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.href.split('#')[0].split('?')[0] } }); if(error) $('lerr').textContent=error.message; };
  $('btnOtp').onclick=async()=>{ const email=$('lemail').value.trim().toLowerCase(); if(!email){ $('lerr').textContent='이메일을 입력하세요.'; return; } $('lerr').textContent=''; $('btnOtp').disabled=true;
    const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } }); $('btnOtp').disabled=false;
    if(error){ $('lerr').textContent=error.message; return; } $('lcode').style.display='flex'; $('ltoken').focus(); toast(email+' 로 인증코드를 보냈습니다.'); };
  $('btnVerify').onclick=async()=>{ const email=$('lemail').value.trim().toLowerCase(), token=$('ltoken').value.trim(); if(!token) return; $('lerr').textContent='';
    const { error } = await sb.auth.verifyOtp({ email, token, type:'email' }); if(error) $('lerr').textContent=error.message; };
  $('ltoken').onkeydown=e=>{ if(e.key==='Enter') $('btnVerify').click(); }; $('lemail').onkeydown=e=>{ if(e.key==='Enter') $('btnOtp').click(); };
}
boot();
</script>
